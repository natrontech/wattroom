<style>
  :root {
    color-scheme: dark;
    --bg: #0b0716; --bg2: #120c22; --panel: #171029; --line: #2b2143; --line2: #3a2d5a; --ink: #f2eff6; --muted: #a79fbd; --faint: #6f678a;
    --neon: #8b2bff; --neon-ink: #c9a6ff; --sun: #f2c230; --paper: #f5f1ec; --paper2: #ebe4dc; --card-ink: #1c1824; --card-muted: #6b6475;
    --earn: #2d6a4f; --with: #1d5e86; --free: #5b6072; --crew: #2b44b8;

  }
  * { box-sizing: border-box; }

  a { color: inherit; }
  header.top { position: sticky; top: 0; z-index: 20; height: 60px; display: flex; align-items: center; gap: 22px; padding: 0 24px; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }

  nav.tabs { display: flex; gap: 4px; }
  nav.tabs a { text-decoration: none; color: var(--muted); padding: 7px 14px; border-radius: 8px; font-weight: 600; }
  nav.tabs a.on { color: var(--ink); background: var(--panel); box-shadow: inset 0 -2px 0 var(--neon); }
  .spacer { flex: 1; }
  .search { width: 260px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--faint); display: flex; align-items: center; padding: 0 12px; gap: 8px; }
  .wallet { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line2); white-space: nowrap; }
  .wallet b { font-variant-numeric: tabular-nums; font-size: 15px; }
  .wallet span { color: var(--muted); font-size: 12px; }
  .coin { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b8, var(--sun) 55%, #c8962a); color: #5a3d06; font: 800 11px var(--head); box-shadow: inset 0 0 0 1.5px #b8861f; flex: none; }
  .coin.sm { width: 16px; height: 16px; font-size: 9px; }
  /* shop */
  .shop { display: grid; grid-template-columns: 236px 1fr; }
  aside.rail { position: sticky; top: 60px; height: calc(100vh - 60px); overflow: auto; padding: 18px 14px 40px 20px; border-right: 1px solid var(--line); }
  .rail h4 { margin: 18px 0 6px; font: 700 11px var(--ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
  .rail a { display: flex; justify-content: space-between; text-decoration: none; padding: 4px 10px; border-radius: 7px; color: var(--muted); font-size: 13px; }
  .rail a:hover, .rail a.on { background: var(--panel); color: var(--ink); }
  .rail a i { font-style: normal; color: var(--faint); font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .sheet { width: min(1120px, 94vw); border-radius: 22px; overflow: hidden; background: var(--paper); color: var(--card-ink); display: grid; grid-template-columns: 1.55fr 1fr; box-shadow: 0 40px 120px -30px #000; }
  .sheet .view { position: relative; aspect-ratio: 16 / 10; background: radial-gradient(120% 95% at 50% 18%, #ffffff 0%, #f1ece6 55%, color-mix(in oklab, var(--tint, #8b8aa0) 22%, #e3dbd2) 100%); }
  .sheet .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .sheet .view .detail canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sheet .side { padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 10px; }

  .sheet .buy { margin-top: auto; display: flex; gap: 10px; align-items: center; }

  #progress { position: fixed; right: 18px; bottom: 16px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line2); color: var(--muted); font-size: 12px; z-index: 30; }
  @media (max-width: 720px) { .shop { grid-template-columns: 1fr; } aside.rail { display: none; } .hero { grid-template-columns: 1fr; } .search, .wallet span { display: none; } .wall { grid-template-columns: 1fr; } }

    .locker .sum { left: 16px; right: 16px; transform: none; flex-wrap: wrap; justify-content: center; }
  }
</style>

<script type="module">
import * as THREE from 'three'
import * as R from './rider3.js'
import { markSVG, wordmarkCanvas } from './brands.js'
import { hostFrame, thumbLoadout, unlockLabel, kindOf, tierPrice } from './shop-data.js'

const cat = await (await fetch('./catalogue.json')).json()
// Artifact links carry only a bare #token: #shop, #shop-buy, #shop-earn, #shop-free, #locker, #brands
const VIEWS = ['shop', 'locker', 'brands']
const [hv, hf] = location.hash.slice(1).split('-')
const P = new Map(VIEWS.includes(hv) ? [['view', hv], ['filter', hf ?? null]] : [])
addEventListener('hashchange', () => { if (VIEWS.includes(location.hash.slice(1).split('-')[0])) location.reload() })
try { await Promise.all(['700 20px Jost', '300 20px Jost', '800 20px Jost', '400 20px Figtree', '900 20px Figtree', 'italic 900 20px Figtree', '700 20px "Bodoni Moda"', '20px "Great Vibes"', '700 20px "JetBrains Mono"', '400 20px Lora', 'italic 600 20px Lora', '900 20px Nunito'].map((f) => document.fonts.load(f))) } catch {}
const view = P.get('view') ?? 'shop'
const onlySlots = P.get('slots')?.split(',') ?? null
const filter = P.get('filter') ?? 'all'
const byId = new Map(cat.items.map((i) => [i.id, i]))
const brandOf = new Map(cat.brands.map((b) => [b.id, b]))
const pal = new Map(cat.palette.map((p) => [p.id, p.hex]))
const fmt = (n) => n.toLocaleString('de-CH').replace(/’/g, ' ')
const span = (a) => { const lo = Math.min(...a), hi = Math.max(...a); return lo === hi ? fmt(lo) : `${fmt(lo)}–${fmt(hi)}` }
// the house mark for WattRoom's own items (no maker): a W on the chrome violet
const HOUSE = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2b2143" stroke="#c9a6ff" stroke-width="1"/><path d="M6.4 8.2 L9 16 L12 10.6 L15 16 L17.6 8.2" fill="none" stroke="#f2eff6" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></svg>`
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
document.getElementById('tabs').innerHTML = [['shop', 'Shop'], ['locker', 'Locker'], ['brands', 'Makers']].map(([v, l]) => `<a href="#${v}" class="${v === view ? 'on' : ''}">${l}</a>`).join('')
const progress = document.getElementById('progress')

// ---------------------------------------------------------------- studio: one offscreen renderer draws every thumbnail
const TW = 360, TH = 240, DPR = 2
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(DPR); renderer.setSize(TW, TH); renderer.setClearColor(0x000000, 0)
const scene = new THREE.Scene()
const sunDir = new THREE.Vector3(0.55, 0.62, 0.56).normalize()
const key = new THREE.DirectionalLight('#fff1dc', 2.5); key.position.copy(sunDir).multiplyScalar(20); scene.add(key, key.target)
scene.add(new THREE.HemisphereLight('#dfe6ff', '#8a7a6a', 1.35))

    colours: { frame: 'teal', frameAccent: 'glacier', decal: 'snow', jerseyA: 'enzian', jerseyB: 'ink', jerseyC: 'snow', layer: 'glacier', layerAccent: 'enzian', shorts: 'ink', shortsAccent: 'glacier', helmet: 'snow', helmetAccent: 'teal', socks: 'snow', sockAccent: 'enzian', shoes: 'snow', gloves: 'ink', barTape: 'leather', bottle: 'glacier', saddle: 'ink', hair: 'brick', warmer: 'enzian', cap: 'cream', capAccent: 'enzian', bag: 'graphite', bagAccent: 'sun', overshoe: 'teal', tyreWall: 'glacier', anodised: 'sun', armband: 'sun' },
    skin: 'skin.4', body: { height: 1.76, build: 'athletic' }
  }
  const W = innerWidth, H = innerHeight - 60
  app.innerHTML = `<div class="locker"><canvas class="stage"></canvas><svg class="leaders" width="${W}" height="${H}"></svg><div class="title"><h1>The locker</h1><p>All ${cat.slots.length} slots on one rider, one draw call</p></div><div class="sum" id="sum"></div></div>`
  const box = app.querySelector('.locker'), svg = app.querySelector('svg.leaders')
  const r2 = new THREE.WebGLRenderer({ canvas: app.querySelector('canvas.stage'), antialias: true, alpha: true })
  r2.setPixelRatio(Math.min(devicePixelRatio, 2)); r2.setSize(W, H); r2.setClearColor(0, 0)
  const sc = new THREE.Scene()
  const k2 = new THREE.DirectionalLight('#fff1dc', 2.6); k2.position.set(6, 8, 7); sc.add(k2, k2.target)
  sc.add(new THREE.HemisphereLight('#cfd8ff', '#5a4a6a', 1.3))
  R.lightRig.uRimSun.value.set('#ffd9b0').multiplyScalar(0.34); R.lightRig.uRimSky.value.set('#a8b4ff').multiplyScalar(0.16)
  const floor = new THREE.Mesh(new THREE.CircleGeometry(1.35, 64).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#2d2346' })); floor.position.y = -0.005; sc.add(floor)
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 0.7).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false })); sh.position.set(0.12, 0.001, 0); sc.add(sh)
  const res = R.resolveLoadout(L, cat)
  const mesh = R.buildRider(res, cat, { logo: logoFor(brandOf.get(res.frame.brand)) })
  const a = new R.RiderAnimator(mesh, { seed: 4 })
  let st; for (let i = 0; i < 60; i++) st = a.update(1 / 30, { cadence: 86, power: 200, speed: 8.4, ftp: 250 })
  R.pose(mesh, { ...st, crank: 0.5, headYaw: 0, stand: 0, swayAmp: 0 })
  const grp = new THREE.Group(); grp.add(mesh); grp.rotation.y = -0.42; grp.position.set(-0.08, 0, 0); sc.add(grp)
  grp.updateMatrixWorld(true)
  const cam = new THREE.PerspectiveCamera(26, W / H, 0.05, 50)
  cam.position.set(1.1, 1.55, 4.9); cam.lookAt(0.02, 0.74, 0); cam.updateMatrixWorld(true)
  R.lightRig.uSunV.value.set(0.6, 0.7, 0.5).normalize().transformDirection(cam.matrixWorldInverse)
  r2.render(sc, cam)
  // anchors: a point on the part, per slot, in bone space
  const m = mesh, rig = m.userData.rig, bk = rig.bk, fit = rig.fit, meta = m.userData.meta, K = meta.head.K, hk = meta.head.k, T = rig.dims.torso
  const P = (bone, p) => p.clone().applyMatrix4(m.userData.bones[bone].matrix).applyMatrix4(grp.matrixWorld)
  const tt = bk.ttFront.clone().lerp(bk.cluster, 0.5)
  const anchors = {
    helmet: P('head', K.clone().add(V(-0.02 * hk, 0.11 * hk, 0))), helmetDeco: P('head', K.clone().add(V(-0.1 * hk, 0.0, 0.09 * hk))), cap: P('head', K.clone().add(V(0.115 * hk, 0.03 * hk, 0.03 * hk))), glasses: P('head', K.clone().add(V(0.1 * hk, 0.0, 0.07 * hk))), lens: P('head', K.clone().add(V(0.105 * hk, -0.006 * hk, 0.02 * hk))), hair: P('head', K.clone().add(V(-0.12 * hk, -0.12 * hk, 0))),
    jersey: P('torso', V(0.0, 0.62 * T, 0.14)), cut: P('torso', V(0.1, 0.95 * T, 0.05)), layer: P('torso', V(0.09, 0.45 * T, 0.12)), plate: P('torso', V(-0.1, 0.42 * T, 0.08)), armband: P('armL', V(0, -0.075, -0.03)),
    gloves: P('handR', V(0.04, 0, 0.02)), warmers: P('foreR', V(0, -0.12, 0.02)), shorts: P('thighR', V(0.02, -0.22, 0.05)), socks: P('shinR', V(0, -0.37, 0.03)), shoes: P('footR', V(0.06, -0.04, 0.04)), overshoes: P('footR', V(0.17, -0.05, 0.03)),
    frame: P('bike', tt.clone().setZ(0.02)), finish: P('bike', bk.dtFront.clone().lerp(bk.bb, 0.35).setZ(0.02)), fork: P('fork', bk.htBot.clone().lerp(bk.front, 0.45).setZ(0.05)), wheels: P('frontWheel', V(0.0, -(bk.Rb - 0.02), 0.02)), hub: P('rearWheel', V(0, 0, 0.05)), tyres: P('frontWheel', V(bk.R * 0.7, bk.R * 0.7, 0.02)),
    groupset: P('bike', bk.rear.clone().add(V(0.012, -0.05, 0.075))), gsFinish: P('bike', bk.bb.clone().addScaledVector(bk.stDir, 0.16).add(V(0.02, -0.01, 0.06))), crank: P('crank', V(fit.crank * 0.6, 0, 0.075)), ring: P('crank', V(-0.06, 0.07, 0.06)), pedals: P('crank', V(fit.crank, 0, fit.pedalZ)),
    saddle: P('bike', fit.contact.clone().add(V(-0.03, 0.0, 0.04))), bars: P('fork', fit.clampPt.clone().add(V(0.07, -0.1, 0.2))), tape: P('fork', fit.clampPt.clone().add(V(0.09, -0.04, -0.2))), computer: P('fork', fit.clampPt.clone().add(V(0.095, 0.015, 0.02))), bell: P('fork', fit.clampPt.clone().add(V(-0.005, 0.03, -0.075))),
    lights: P('bike', fit.contact.clone().addScaledVector(bk.stDir, -0.115).add(V(-0.03, 0, 0))), bottles: P('bike', bk.bb.clone().lerp(bk.dtFront, 0.36).add(V(-0.04, 0.05, 0.02))), cages: P('bike', bk.bb.clone().lerp(bk.dtFront, 0.26).add(V(-0.02, 0.03, 0.03))),
    bags: P('bike', bk.ttFront.clone().lerp(bk.cluster, 0.22).add(V(0, 0.04, 0.02))), utility: P('bike', bk.rear.clone().add(V(-0.05, bk.R + 0.04, 0.03))), charm: P('bike', fit.contact.clone().add(V(-0.08, -0.08, 0.01)))
  }
  const toScreen = (p) => { const q = p.clone().project(cam); return [(q.x + 1) / 2 * W, (1 - q.y) / 2 * H] }
  const labelOf = (slot) => { const it = res[slot], b = brandOf.get(it.brand), pr = tierPrice(cat, it), k = kindOf(it); const opt = it.options ? it.options.find((o) => o.id === res.opt[slot])?.name : null; return { it, b, html: `${b ? markSVG(b, 24) : HOUSE(24)}<div class="t"><div class="s">${esc(cat.slots.find((s) => s.id === slot).label)}</div><div class="n">${esc(it.name)}${opt ? ' · ' + esc(opt) : ''}</div></div><div class="p ${k === 'earn' ? 'e' : ''}">${pr ? `<span class="coin sm">B</span>${fmt(pr)}` : k === 'earn' ? 'earned' : k === 'with' ? 'with frame' : k === 'crew' ? 'crew' : 'free'}</div>` } }
  // exploded view: a numbered badge on each part (nudged apart where parts crowd), a numbered parts list either side
  const order = [...cat.slots.filter((s) => s.group === 'rider'), ...cat.slots.filter((s) => s.group === 'bike')]
  const pts = order.map((s, i) => { const p = toScreen(anchors[s.id] ?? P('bike', bk.bb)); return { slot: s.id, n: i + 1, a: p, b: [...p] } })
  for (let it = 0; it < 220; it++) {
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const u = pts[i].b, v = pts[j].b, dx = v[0] - u[0], dy = v[1] - u[1], d = Math.hypot(dx, dy) || 0.01
      if (d < 25) { const f = (25 - d) / 2 / d; u[0] -= dx * f; u[1] -= dy * f; v[0] += dx * f; v[1] += dy * f }
    }
    for (const e of pts) { e.b[0] += (e.a[0] - e.b[0]) * 0.04; e.b[1] += (e.a[1] - e.b[1]) * 0.04 }
  }
  let marks = ''
  for (const e of pts) {
    const moved = Math.hypot(e.b[0] - e.a[0], e.b[1] - e.a[1]) > 7
    if (moved) marks += `<path d="M${e.a[0]} ${e.a[1]} L${e.b[0]} ${e.b[1]}" stroke="#c9a6ff" stroke-width="1.2" opacity="0.9"/>`
    marks += `<circle cx="${e.a[0]}" cy="${e.a[1]}" r="2.6" fill="#f2eff6"/>`
  }
  for (const e of pts) marks += `<g><circle cx="${e.b[0]}" cy="${e.b[1]}" r="10.5" fill="${e.n <= 17 ? '#8b2bff' : '#1d1530'}" stroke="#c9a6ff" stroke-width="1.2"/><text x="${e.b[0]}" y="${e.b[1] + 4}" text-anchor="middle" font-family="Avenir Next, system-ui" font-weight="700" font-size="11" fill="#f2eff6">${e.n}</text></g>`
  svg.innerHTML = marks
  const column = (list, left) => {
    const top = 78, gap = Math.min(40, (H - 150) / list.length)
    list.forEach((e, i) => {
      const { html } = labelOf(e.slot)
      const div = document.createElement('div'); div.className = 'callout'; div.style.left = `${left}px`; div.style.top = `${top + i * gap}px`
      div.innerHTML = `<span class="num ${e.n <= 17 ? 'r' : 'b'}">${e.n}</span>` + html; box.appendChild(div)
    })
  }
  column(pts.filter((e) => e.n <= 17), 22)
  column(pts.filter((e) => e.n > 17), W - 22 - 318)
  const worth = cat.slots.reduce((s, x) => s + (tierPrice(cat, res[x.id]) ?? 0), 0)
  const earned = cat.slots.filter((x) => kindOf(res[x.id]) === 'earn').length
  const makers = new Set(cat.slots.map((x) => res[x.id].brand).filter(Boolean)).size
  document.getElementById('sum').innerHTML = `<div><b>${cat.slots.length}</b>slots filled</div><div><b>${makers}</b>makers</div><div><b>${fmt(worth)}</b>Batzen of it bought</div><div><b>${earned}</b>earned, never sold</div><div><b>${fmt(m.geometry.index.count / 3)}</b>triangles · ${m.userData.detail < 1 ? 'detail ' + m.userData.detail : 'full detail'}</div><div>${res.notes.length ? esc(res.notes.map((n) => n.why).join('; ')) : 'no conflicts'}</div>`
  progress.textContent = 'Locker ready'
  progress.hidden = true
}
// ---------------------------------------------------------------- try-on: the item on a whole rider, free, with the detail shot beside it
const modal = document.getElementById('modal')
function tryOn(it, opt = null) {
  const b = brandOf.get(it.brand), price = tierPrice(cat, it), rule = unlockLabel(it, cat)
  const optNow = opt ?? it.options?.[0]?.id ?? null
  modal.innerHTML = `<div class="sheet" style="--tint:${b ? b.colours[0] : '#8b8aa0'}"><div class="view"><canvas class="big"></canvas><div class="detail"><canvas class="small"></canvas></div></div>
    <div class="side"><div class="who">${b ? markSVG(b, 40) : ''}<div><div class="maker">${b ? esc(b.name) : 'WattRoom'}</div><h2>${esc(it.name)}</h2></div></div>
      <p class="spec" style="-webkit-line-clamp:unset;min-height:0">${esc(it.spec ?? it.blurb ?? '')}</p>
      ${it.options ? `<div class="opts">${it.options.map((o) => `<span data-opt="${o.id}" class="${o.id === optNow ? 'on' : ''}">${esc(o.name)}</span>`).join('')}</div>` : ''}
      <dl><dt>Slot</dt><dd>${esc(cat.slots.find((s) => s.id === it.slot).label)}</dd>${it.era ? `<dt>Era</dt><dd>${esc(it.era)}</dd>` : ''}${cat.slots.find((s) => s.id === it.slot).group === 'bike' ? `<dt>Shown on</dt><dd>${esc(hostFrame(it, cat).name)}${it.requires ? ` · needs ${esc(Object.entries(it.requires).map(([k, v]) => (Array.isArray(v) ? v.join('/') : k) + (Array.isArray(v) ? ' ' + k : ' mounts')).join(', '))}` : ''}</dd>` : ''}<dt>Colours</dt><dd>Yours to pick, free</dd><dt>Changes speed</dt><dd>No. Looks only.</dd></dl>
      <div class="buy">${price ? `<button>Buy · <span class="coin sm" style="vertical-align:-3px">B</span> ${fmt(price)}</button><button class="ghost">Keep trying</button>` : `<span class="rule">${kindOf(it) === 'earn' ? LOCK : STAR}<span>${esc(rule)}</span></span>`}</div>
      <p class="fine">${price ? 'Buying has a 10-minute undo while unworn. ' : ''}Try-on is free and changes nothing you own.</p></div></div>`
  modal.classList.add('on')
  const big = modal.querySelector('canvas.big'), small = modal.querySelector('canvas.small')
  const bw = 700, bh = 438
  const { canvas } = renderItem(it, optNow, [bw, bh], { cam: 'rider', bikeOnly: false })
  big.width = bw * DPR; big.height = bh * DPR; big.getContext('2d').drawImage(canvas, 0, 0, big.width, big.height)
  const d = renderItem(it, optNow, [TW, TH])
  small.width = TW * DPR; small.height = TH * DPR; small.getContext('2d').drawImage(d.canvas, 0, 0, small.width, small.height)
  renderer.setSize(TW, TH)
  for (const s of modal.querySelectorAll('[data-opt]')) s.onclick = (e) => { e.stopPropagation(); tryOn(it, s.dataset.opt) }
}
modal.onclick = (e) => { if (e.target === modal || e.target.classList.contains('ghost')) modal.classList.remove('on') }
addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('on') })
document.addEventListener('click', (e) => { const btn = e.target.closest('.try'); if (btn) tryOn(byId.get(btn.closest('article').dataset.id)) })
if (P.get('try') && byId.has(P.get('try'))) tryOn(byId.get(P.get('try')), P.get('opt'))
window.__ready = true
</script>
