<!doctype html>
<!--
  Source of docs/assets/social-preview.png — GitHub's repo social preview
  (Settings → General → Social preview), 1280×640. Re-render after a brand or
  screenshot change:

    npx playwright screenshot --viewport-size=1280,640 --wait-for-timeout=2000 \
      docs/assets/social-preview.html docs/assets/social-preview.png

  Colours are literal copies of web/src/app.css's dark pairs: this file renders
  outside the app, so the tokens never resolve.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WattRoom — social preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Chakra+Petch:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        position: relative;
        background: #0a0118;
        color: #fff;
        font-family: "Barlow", system-ui, sans-serif;
      }
      /* The landing page's grid, plus the one glow the identity allows on
			   live data (ADR-0005) — here it sits behind the room itself. */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(
            to right,
            rgba(139, 43, 255, 0.16) 0 1px,
            transparent 1px 100%
          ),
          linear-gradient(
            to bottom,
            rgba(139, 43, 255, 0.16) 0 1px,
            transparent 1px 100%
          );
        background-size: 64px 64px;
      }
      .glow {
        position: absolute;
        width: 900px;
        height: 900px;
        right: -220px;
        top: -260px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 61, 139, 0.28),
          transparent 62%
        );
      }
      .card {
        position: relative;
        height: 100%;
        padding: 64px;
        display: flex;
        flex-direction: column;
        width: 680px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand span {
        font-family: "Chakra Petch", sans-serif;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -0.01em;
      }
      h1 {
        font-family: "Chakra Petch", sans-serif;
        font-weight: 700;
        font-size: 72px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        margin-top: auto;
      }
      h1 em {
        font-style: normal;
        color: #8b2bff;
      }
      p {
        margin-top: 22px;
        font-size: 25px;
        line-height: 1.35;
        color: #9182b8;
        max-width: 560px;
      }
      ul {
        margin-top: auto;
        padding-top: 34px;
        display: flex;
        gap: 10px;
        list-style: none;
      }
      li {
        font-size: 17px;
        color: #cfc4e8;
        border: 1px solid rgba(145, 130, 184, 0.35);
        border-radius: 999px;
        padding: 7px 15px;
      }
      /* The product, tilted away from the copy — cropped on purpose: a
			   readable dashboard at this size would be a wall of 8 px text. */
      .shot {
        position: absolute;
        top: 76px;
        left: 690px;
        width: 900px;
        height: 600px;
        overflow: hidden;
        border-radius: 16px;
        border: 1px solid rgba(139, 43, 255, 0.45);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
        transform: perspective(1600px) rotateY(-16deg) rotate(-2deg);
        transform-origin: left center;
      }
      /* The app rail carries no story at this size — start the crop at the
			   numbers. */
      .shot img {
        width: 1030px;
        margin-left: -152px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="shot"><img src="room-live.png" alt="" /></div>
    <div class="card">
      <div class="brand">
        <svg viewBox="0 0 64 64" width="42" height="42" aria-hidden="true">
          <defs>
            <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff3d8b" />
              <stop offset="100%" stop-color="#8b2bff" />
            </linearGradient>
          </defs>
          <g fill="url(#s)">
            <rect x="2" y="12" width="8" height="46" rx="4" />
            <rect x="15" y="38" width="8" height="20" rx="4" />
            <rect x="28" y="24" width="8" height="34" rx="4" />
            <rect x="41" y="38" width="8" height="20" rx="4" />
            <rect x="54" y="12" width="8" height="46" rx="4" />
          </g>
        </svg>
        <span>WattRoom</span>
      </div>
      <h1>Train together,<br /><em>not alone.</em></h1>
      <p>
        Discord for indoor cycling — structured workouts your whole crew rides
        at once. No virtual world: your watts are the game.
      </p>
      <ul>
        <li>Free &amp; AGPL</li>
        <li>Self-hosted</li>
        <li>Go + SvelteKit</li>
        <li>BLE FTMS</li>
      </ul>
    </div>
  </body>
</html>
