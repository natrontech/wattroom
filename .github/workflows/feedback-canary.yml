# The in-app feedback loop is the alpha's only channel from a rider on a bike to
# this repo (ADR-0006), and it was dead for ten days without anyone noticing: a
# root-owned volume made every write fail inside a container that started and
# answered /api/healthz (#1730). One rider report exists in the repo's whole
# history, which is what a silent failure looks like from the outside.
#
# #1753 fixed that volume and added an image probe, so that bug cannot return.
# This is the other half: proof the loop is *alive*, which no build-time check
# can give. It rides the chain the way a rider does — sign in, post a report,
# and require an issue URL back.
#
# Two distinct silent failures it catches (#2108):
#   - the disk write fails  -> 500, and a rider mid-interval does not report
#     that the report button is broken.
#   - GitHub fails          -> 200 with an EMPTY issue url. Still silent today:
#     the handler logs "feedback issue failed, report kept on disk" and the only
#     trace is a slog.Warn nobody reads. Asserting the url is what sees it.
name: feedback-canary

on:
  schedule:
    - cron: '0 7 * * *'
  # So it can be run by hand the day something looks wrong, and the first time
  # the secret is set.
  workflow_dispatch:

concurrency:
  group: feedback-canary
  cancel-in-progress: false

jobs:
  canary:
    # A fork has neither the secret nor any business posting to production.
    if: github.repository == 'natrontech/wattroom'
    runs-on: ubuntu-latest
    permissions:
      issues: write # to close the issue it files
    steps:
      - name: a tapped flag still becomes a GitHub issue
        env:
          BASE: https://wattroom.ch
          SYNTHETIC_TOKEN: ${{ secrets.WATTROOM_SYNTHETIC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Through env, never interpolated into the script: an ${{ }} inside a
          # run block is substituted before bash sees it, which makes the step
          # untestable outside Actions and is the shape shell-injection through
          # a workflow expression takes.
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${SYNTHETIC_TOKEN}" ]; then
            echo "WATTROOM_SYNTHETIC_TOKEN is not set on this repository." >&2
            echo "Add it under Settings > Secrets and variables > Actions — the" >&2
            echo "same value the server reads for POST /api/auth/synthetic." >&2
            exit 1
          fi

          jar=$(mktemp)
          out=$(mktemp)

          # 1. Enter like the ride monitor does (#153). POST-only and bearer
          #    authenticated; no browser, no OAuth.
          code=$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -c "$jar" \
            -X POST -H "Authorization: Bearer $SYNTHETIC_TOKEN" \
            "$BASE/api/auth/synthetic" || true)
          # 204, not 200: handleSynthetic sets the cookie and returns no body.
          if [ "$code" != 204 ]; then
            echo "Synthetic sign-in failed: HTTP $code (expected 204)" >&2
            echo "The feedback loop cannot be reached, so its health is unknown." >&2
            sed 's/^/    /' "$out" >&2
            exit 1
          fi
          grep -q wattroom_session "$jar" || {
            echo "Sign-in returned 200 but set no wattroom_session cookie." >&2
            exit 1
          }

          # 2. The report. Route and first error are deliberately unmistakable:
          #    they are the dedup fingerprint, and one that collided with a real
          #    rider's would let this job close their issue.
          payload=$(jq -nc \
            --arg note "Synthetic canary: checking that a tapped flag still reaches GitHub." \
            --arg err "canary/feedback-loop" \
            --arg ua "wattroom-feedback-canary (GitHub Actions)" \
            --argjson ms "$(date +%s000)" \
            '{route: "/canary", note: $note, firstError: $err,
              clientBuild: "canary", userAgent: $ua, trainer: "none", clientMs: $ms}')

          code=$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -b "$jar" \
            -X POST -H 'Content-Type: application/json' -d "$payload" \
            "$BASE/api/feedback" || true)

          if [ "$code" = 429 ]; then
            echo "Rate limited: one report per rider per 10s." >&2
            echo "Another run of this job is within the window — retry in a moment." >&2
            exit 1
          fi
          if [ "$code" != 200 ]; then
            echo "POST /api/feedback returned HTTP $code — a rider tapping the flag" >&2
            echo "right now would lose their report. This is #1730's shape: the" >&2
            echo "server is up, the write is not." >&2
            sed 's/^/    /' "$out" >&2
            exit 1
          fi

          # 3. The assertion that matters. A 200 with no url means the report
          #    reached disk and GitHub refused it — invisible in every other way.
          url=$(jq -r '.issue // ""' "$out")
          if [ -z "$url" ]; then
            echo "The report was accepted and written to disk, but NO GitHub issue" >&2
            echo "was filed. Rider reports are landing where nobody will read them." >&2
            echo "Check the server log for 'feedback issue failed, report kept on" >&2
            echo "disk', and the issuer's token." >&2
            exit 1
          fi
          echo "The feedback loop is alive: $url"

          # 4. Close it. FileOrComment dedups on OPEN issues only, so closing
          #    here means the next run files a fresh one instead of commenting
          #    forever on this — a closed trail, and nothing on the board.
          gh issue close "$url" --repo "$REPO" --reason completed \
            --comment "Filed and closed by the feedback canary (#2108): the chain from \`POST /api/feedback\` to a GitHub issue is working. Run \`$RUN_ID\`."
