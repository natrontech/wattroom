# The end-to-end flows (WATTROOM.md): simulated trainers ride workouts through
# the login gate like every rider, on the built SPA and the real Go server.
#
# Sharded across runners; the `e2e` job at the bottom is the one check to
# read. It always reports, so it can be required, and on a PR that changes no
# code it passes without riding: there is nothing to break.
name: e2e

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - '.github/workflows/e2e.yml'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: see the note in ci.yml (#2806).
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      world: ${{ steps.diff.outputs.world }}
      plan: ${{ steps.diff.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # main runs everything. A PR checks out its merge commit, whose first
      # parent is the base it is measured against.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          world=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            code=false
            if grep -qE '^(web/|server/|\.github/workflows/e2e\.yml$)' <<<"$files"; then
              code=true
            fi
            # What the @world specs stand on: the world, both riding surfaces and
            # their routes, and the harness (Playwright and three.js versions too).
            world_paths='^(web/src/lib/(world|ride|session)/|web/src/routes/\(app\)/(ride|dev/world|crew/\[id\]/s/\[session\]|crew/\[id\]/v/\[channel\]/training)/|web/e2e/.*\.(js|ts)$|web/(playwright\.config\.ts|package\.json|pnpm-lock\.yaml)$|\.github/workflows/e2e\.yml$)'
            world=false
            while read -r f; do
              case "$f" in
                # A spec is harness only when it is one of the world's own.
                *.spec.ts) if [ -f "$f" ] && grep -q '@world' "$f"; then world=true; fi ;;
                *) if grep -qE "$world_paths" <<<"$f"; then world=true; fi ;;
              esac
            done <<<"$files"
          fi
          echo "code=$code world=$world"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "world=$world" >> "$GITHUB_OUTPUT"
          # Three shards deal out the suite less the world. The @world specs
          # draw in software GL, two screens at once in bunch-world.spec.ts,
          # and starve beside any other world; they run apart, one at a time.
          n=3
          plan=""
          for i in $(seq 1 $n); do
            plan+="{\"shard\":\"$i\",\"args\":\"--shard=$i/$n --grep-invert=@world\"},"
          done
          if [ "$world" = true ]; then
            plan+='{"shard":"world","args":"--grep=@world --workers=2 --retries=0"},'
          fi
          echo "plan={\"include\":[${plan%,}]}" | tee -a "$GITHUB_OUTPUT"

  shard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every shard finishes, so a red run names every failure at once.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.plan) }}
    env:
      BROWSERS: ${{ matrix.shard == 'world' && 'chromium webkit firefox' || 'chromium' }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          POSTGRES_DB: wattroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # voice-duck.spec.ts's real LiveKit connection (#1171). A service
      # container takes no `command:`, so the devkey/secret pair e2e/server.js
      # defaults to comes from `keys:`; `node_ip: 127.0.0.1` lets the runner's
      # own browser reach the published RTC ports.
      livekit:
        image: livekit/livekit-server:v1.13
        env:
          LIVEKIT_CONFIG: |
            port: 7880
            rtc:
              tcp_port: 7881
              port_range_start: 51000
              port_range_end: 51050
              use_external_ip: false
              node_ip: 127.0.0.1
            keys:
              devkey: secret
        ports:
          - '7880:7880'
          - '7881:7881'
          - '51000-51050:51000-51050/udp'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The default cache key looks for go.sum at the root and finds nothing.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Warms the build cache for e2e/server.js's `go run .`.
      - run: go build -o /dev/null .
        working-directory: server
      # Not `pnpm/setup` — see the note in ci.yml's `web` job (#2375).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.shard == 'world' && 'all' || 'chromium' }}
      - run: pnpm exec playwright install $BROWSERS
        working-directory: web
      # The runner ships Chromium's libraries but not WebKit's or Firefox's,
      # which run world-place.spec.ts only (#3224). Retried once: apt mirrors
      # flake.
      - name: WebKit and Firefox libraries
        if: matrix.shard == 'world'
        working-directory: web
        run: |
          pnpm exec playwright install-deps webkit firefox ||
            { sleep 15; pnpm exec playwright install-deps webkit firefox; }
      # No build step: playwright.config.ts's webServer always builds, so a
      # reused bundle can never be what gets tested. --add-reporter, not
      # --reporter: the config's reporters include e2e/shard-by-file.ts.
      - name: Run this shard
        working-directory: web
        env:
          ARGS: ${{ matrix.args }}
        run: pnpm exec playwright test $ARGS --add-reporter=blob
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-trace-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7

  # The check to read. A skipped job counts as passed on a ruleset, so this
  # one always runs and says why it passed.
  e2e:
    needs: [changes, shard]
    if: always()
    runs-on: ubuntu-latest
    env:
      CHANGES: ${{ needs.changes.result }}
      CODE: ${{ needs.changes.outputs.code }}
      SHARDS: ${{ needs.shard.result }}
      MERGE: ${{ needs.shard.result == 'success' || needs.shard.result == 'failure' }}
      GREP: ${{ needs.changes.outputs.world != 'true' && '--grep-invert=@world' || '' }}
    steps:
      - if: env.MERGE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.MERGE == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - if: env.MERGE == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: env.MERGE == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: web
      - if: env.MERGE == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: web/blob-reports
          merge-multiple: true
      - name: One report from every shard
        if: env.MERGE == 'true'
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
        run: pnpm exec playwright merge-reports --reporter=github,json blob-reports
      # A test the shards' deal dropped would run nowhere and fail nothing.
      - name: Every test ran on a shard
        if: env.MERGE == 'true'
        working-directory: web
        run: |
          listed=$(pnpm exec playwright test --list $GREP --reporter=./e2e/shard-by-file.ts | sed -n 's/^Total: \([0-9]*\) tests.*/\1/p')
          reported=$(node -p "const s = require('./merged.json').stats; s.expected + s.unexpected + s.flaky + s.skipped")
          echo "listed $listed, reported $reported"
          [ "$listed" = "$reported" ]
      - name: Verdict
        if: always()
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::Could not tell what this change touches (changes: $CHANGES)."
            exit 1
          fi
          if [ "$CODE" != true ]; then
            echo "No change under web/, server/ or this workflow: nothing to ride, so no shard ran."
            exit 0
          fi
          if [ "$SHARDS" != success ]; then
            echo "::error::A shard did not pass (shards: $SHARDS)."
            exit 1
          fi
          echo "Every shard passed."
