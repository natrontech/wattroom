name: e2e

# The smoke flows in web/e2e against a production build. Advisory: not one of
# main's required checks.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'server/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          POSTGRES_DB: wattroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      livekit:
        image: livekit/livekit-server:v1.13
        env:
          LIVEKIT_CONFIG: |
            port: 7880
            rtc:
              tcp_port: 7881
              port_range_start: 51000
              port_range_end: 51050
              use_external_ip: false
              node_ip: 127.0.0.1
            keys:
              devkey: secret
        ports:
          - '7880:7880'
          - '7881:7881'
          - '51000-51050:51000-51050/udp'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go build -o /dev/null .
        working-directory: server
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm exec playwright install chromium
        working-directory: web
      - run: pnpm exec playwright test
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-trace
          path: web/test-results/
          retention-days: 7
