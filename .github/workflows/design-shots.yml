# Main's design shots, taken once for every design check that follows (#3858).
# Each push to main that changes what is drawn runs the design-shots spec on
# every surface, both schemes, the world in software GL (#3826), in parallel
# shards (#3883), and uploads the captures and their probes as one
# `design-shots-<sha>` for 14 days.
# scripts/design-before.sh fetches the one for a branch's merge base, so a
# check no longer builds and captures main on the author's machine.
#
# Advisory: no ruleset requires it. A pull request that edits this file runs
# it too, so a change here proves itself; workflow_dispatch re-takes a commit.
name: design-shots

on:
  push:
    branches: [main]
    # scripts/design-before.sh accepts an older commit's artifact when nothing
    # under these paths changed since, so the two lists stay the same.
    paths:
      - 'web/**'
      - 'server/internal/og/**'
      - '.github/workflows/design-shots.yml'
  pull_request:
    paths:
      - '.github/workflows/design-shots.yml'
  workflow_dispatch:

# One run at a time on main, with only the newest push waiting behind it: a
# commit skipped in a burst of merges is covered by the next one's artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: see the note in ci.yml (#2806). Uploading an artifact needs no
# token scope.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # The slow rides each get a runner; "rest" takes every other surface,
      # including any added later, by excepting the named ones. The shots in a
      # shard keep the spec's file order, which puts the rides that save last.
      # Times on main (#3883): ride-road-world rides the world four times and
      # closing-card three sessions.
      - id: plan
        run: |
          shards=(
            "road-world:ride-road-world"
            "closing:closing-card ride-road-end"
            "collective:ride-game-collective"
            "games:ride-game-backyard roadside-chalk ride-session-road"
            "race:ride-race ride-session-flat"
            "detail:ride-detail world-start"
            "pages:landing flow-f3 ride-status ride-skyline-fallback ride-workout-flat"
          )
          plan=""
          named=""
          for s in "${shards[@]}"; do
            plan+="{\"shard\":\"${s%%:*}\",\"surfaces\":\"${s#*:}\",\"except\":\"\"},"
            named+="${s#*:} "
          done
          plan+="{\"shard\":\"rest\",\"surfaces\":\"\",\"except\":\"${named% }\"}"
          echo "matrix={\"include\":[$plan]}" | tee -a "$GITHUB_OUTPUT"

  shots:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard finishes: the artifact is main's for every surface shot.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # The same pair e2e.yml rides on: the session surfaces sit in a voice
    # channel, and the server will not offer one without LiveKit.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          POSTGRES_DB: wattroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      livekit:
        image: livekit/livekit-server:v1.13
        env:
          LIVEKIT_CONFIG: |
            port: 7880
            rtc:
              tcp_port: 7881
              port_range_start: 51000
              port_range_end: 51050
              use_external_ip: false
              node_ip: 127.0.0.1
            keys:
              devkey: secret
        ports:
          - '7880:7880'
          - '7881:7881'
          - '51000-51050:51000-51050/udp'
    env:
      # The service's own database, fresh with the job: `make design-shots`
      # makes one only where it can reach the shared dev Postgres.
      WATTROOM_DB: postgres://wattroom:wattroom@localhost:5432/wattroom
      # A scoped run skips the TV and phone variants its ids do not name; a
      # shard is part of a full run, so it takes them all.
      DESIGN_SHOTS_VARIANTS: all
      DESIGN_SHOTS_EXCEPT: ${{ matrix.except }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      # Warm the build cache for the harness's `go run .`, as e2e.yml does.
      - run: go build -o /dev/null .
        working-directory: server
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install chromium
        working-directory: web
      # A surface that fails leaves FAILED-<id>.png and .txt beside the rest,
      # and a warning here, not a red run: the artifact is still main's for
      # every other surface. phone-ride and closing-card's phone shot fail on
      # Linux until #3854. A run that shot nothing is red.
      - name: make design-shots
        run: |
          out="$RUNNER_TEMP/design-shots"
          if make design-shots OUT="$out" SURFACES="${{ matrix.surfaces }}"; then exit 0; fi
          failed=$(ls "$out"/*/FAILED-*.txt 2>/dev/null) || {
            echo "::error::make design-shots failed before any surface did"
            exit 1
          }
          for f in $failed; do
            echo "::warning title=$(basename "$(dirname "$f")") $(basename "$f" .txt)::$(head -c 300 "$f" | tr '\n' ' ')"
          done
      # Uploaded even when a surface failed: the rest are still main's, and a
      # FAILED-<id>.png says which one a check has to capture itself.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: design-shots-parts-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/design-shots
          retention-days: 1
          if-no-files-found: error

  # One artifact per commit, as before: the parts hold disjoint files under
  # dark/ and light/, and scripts/design-before.sh downloads the merged name.
  merge:
    needs: shots
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: design-shots-parts-${{ github.sha }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/design-shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-shots-${{ github.sha }}
          path: ${{ runner.temp }}/design-shots
          retention-days: 14
          if-no-files-found: error
