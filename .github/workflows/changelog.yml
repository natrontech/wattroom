name: changelog

# Its own workflow so the label can clear it (#1043). `ci.yml` triggers on the
# default pull_request activity types — opened, synchronize, reopened — which
# do not include `labeled`, so applying `no-changelog` to a PR whose check had
# already failed changed nothing until somebody pushed or reopened it. The
# label existed to exempt a PR and could not.
#
# Not solved by adding `labeled` to ci.yml: that would re-run server, web, e2e
# and vulncheck on every label change, which costs far more than the papercut
# — this repo cancels superseded runs and skips the ride on code-free PRs for
# exactly that reason (#963). This job is a checkout and a bash loop.
#
# The job keeps its `changelog` name so anything referring to it by context
# still matches.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no-changelog') &&
      !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # An entry that does not begin with "- " is not a list item, so Markdown
      # folds it into the bullet above it: four fixes in 2026.09.15's notes
      # were hidden inside other fixes that way (#546). `make release`
      # normalises now, but the file is what its author reads back, so it
      # should be a bullet on the page too.
      - name: a changelog entry is a list item
        run: |
          bad=()
          while IFS= read -r f; do
            [ "$f" = changelog.d/README.md ] && continue
            case "$(awk 'NF {print; exit}' "$f")" in
              '- '*) ;;
              *) bad+=("$f") ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'changelog.d/*.md')

          if [ ${#bad[@]} -gt 0 ]; then
            printf 'This changelog entry does not start with "- ":\n\n' >&2
            printf '    %s\n' "${bad[@]}" >&2
            cat >&2 <<'MSG'

          The release notes are a list, so an entry without its leading dash
          gets folded into the bullet above it and the change disappears
          inside somebody else's. Start the file with "- " and indent
          continuation lines by two spaces:

              - What's new no longer goes blank. Any release note that used
                the same code span twice took the whole page down with it.

          See changelog.d/README.md.
          MSG
            exit 1
          fi
          echo "Changelog entries are list items."

      - name: a rider-visible change needs a changelog line
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

          # CHANGELOG.md is generated from changelog.d/ at release time. Editing
          # it by hand puts text where nothing will ever read it — the entry
          # never reaches a release and just sits there looking published.
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo 'This PR edits CHANGELOG.md by hand.' >&2
            echo '' >&2
            echo 'That file is collated from changelog.d/ when a release is cut, so an' >&2
            echo 'entry added here is never read and never ships. Put it in' >&2
            echo 'changelog.d/<category>-<slug>.md instead — see changelog.d/README.md.' >&2
            exit 1
          fi

          if ! grep -qE '^(server/|web/src/)' <<<"$changed"; then
            echo "No server/ or web/src change — nothing to announce."
            exit 0
          fi
          if grep -qE '^changelog\.d/(added|changed|deprecated|removed|fixed|security)-' <<<"$changed"; then
            echo "Changelog entry present."
            exit 0
          fi
          if grep -qE '^changelog\.d/' <<<"$changed"; then
            echo 'A changelog.d/ file was added but its name does not start with a' >&2
            echo 'category, so the release step would drop it silently.' >&2
            exit 1
          fi
          cat >&2 <<'MSG'
          This PR changes server/ or web/src but adds no changelog entry.

          Add one file — not an edit to CHANGELOG.md, which every agent would
          then conflict on:

              changelog.d/<category>-<slug>.md

          category is added / changed / deprecated / removed / fixed / security.
          The file holds the bullet as it should appear, written for someone
          deciding whether to upgrade. See changelog.d/README.md.

          If the change genuinely cannot be seen by a rider — tooling, tests,
          refactors — apply the `no-changelog` label instead.
          MSG
          exit 1
