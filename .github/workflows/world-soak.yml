# The world soak (#3851): web/scripts/world-soak.mjs rides /dev/world for two
# simulated hours at 16× in software GL and fails if the heap, three.js's
# geometries and textures, the ground held, or the page's listeners and
# timers climb (docs/spec/world.md "Soak"). Software GL's frame times are
# reported, not judged. About 45 minutes, so it runs on main when the world
# changes and once a week, and on a pull request that edits the soak itself.
# Always the two hours: a shorter ride ends while the ground around the eye is
# still filling in, and judges that. Advisory: no ruleset requires it. The
# report is attached as `world-soak`.
name: world-soak

on:
  push:
    branches: [main]
    paths:
      - 'web/src/lib/world/**'
      - 'web/e2e/world-soak.spec.ts'
      - 'web/e2e/soak/**'
      - 'web/scripts/world-soak.mjs'
      - '.github/workflows/world-soak.yml'
  pull_request:
    paths:
      - 'web/e2e/world-soak.spec.ts'
      - 'web/e2e/soak/**'
      - 'web/scripts/world-soak.mjs'
      - '.github/workflows/world-soak.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      minutes:
        description: Simulated minutes to ride
        default: '120'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: see the note in ci.yml (#2806).
permissions:
  contents: read

jobs:
  world-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          POSTGRES_DB: wattroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WATTROOM_DB: postgres://wattroom:wattroom@localhost:5432/wattroom
      MINUTES: ${{ inputs.minutes || '120' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The default cache key looks for go.sum at the root and finds nothing.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Warms the build cache for e2e/server.js's `go run .`.
      - run: go build -o /dev/null .
        working-directory: server
      # Not `pnpm/setup` — see the note in ci.yml's `web` job (#2375).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install chromium
        working-directory: web
      - run: node scripts/world-soak.mjs --minutes "$MINUTES" --out world-soak
        working-directory: web
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-soak
          path: web/world-soak/
          if-no-files-found: ignore
