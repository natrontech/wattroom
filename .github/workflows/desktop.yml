# The desktop shell's smoke (#296). Its own workflow so `paths` can gate it:
# the shell changes rarely, and every other PR would otherwise pay for an
# Electron binary download to prove nothing.
#
# Linux and macOS (#3011). Most of what the smoke asserts is platform-independent
# JavaScript — the preload bridge's keys, Node being unreachable from the
# renderer, the navigation guard, the offline screen — but the menu and
# Notification Center exist only on a Mac, and all three bugs of #3001 were
# macOS-only, with tests that skip on Linux. A macOS runner bills at ten times a
# Linux one; the `paths` gate below means it is paid only when the shell
# changes. Advisory, like every check outside ci.yml's required five.
# What differs per platform beyond that — packaging, signing and TCC — is not
# exercised here: it belongs to the signing and release workflows, on the
# platform each one targets.
#
# What this cannot cover at all, on any runner: BLE and audio are not testable
# in CI, and the native chooser is not Playwright-drivable (RESEARCH.md §15.5).
# The four handlers that are the shell's actual content therefore need a
# hardware session per OS — a green check here is not a paired trainer.
name: desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  # Repeated rather than a YAML anchor: the Actions parser rejects anchors.
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: see the note in ci.yml (#2806).
permissions:
  contents: read

jobs:
  smoke:
    strategy:
      # One platform's failure must not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not `pnpm/setup` — see the note in ci.yml's `web` job (#2375).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      # electron@44 ships no `scripts` field at all, so `pnpm install` does not
      # fetch the platform binary and `electron .` starts nothing. install.js is
      # the script older majors ran themselves.
      - name: fetch the Electron binary
        working-directory: desktop
        run: test -d node_modules/electron/dist || node node_modules/electron/install.js
      # Real key presses for the shortcut test (#3007): Playwright's keys go to
      # the page and never reach the menu's accelerators. The test presses
      # them on Linux only.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xdotool
      # Electron needs an X server on Linux, and Playwright's _electron launches
      # the real binary rather than a headless browser. A Mac runner has a
      # display of its own.
      - name: smoke
        working-directory: desktop
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}pnpm exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: desktop-smoke-trace-${{ matrix.os }}
          path: desktop/test-results/
          retention-days: 7

  # The PACKAGED shell, driven over CDP (#1314, ADR-0088): electron-builder's
  # own output with its fuses flipped — no --inspect, so not _electron — signs
  # in through the wattroom:// hand-off from a second launch, rides the
  # SimulatedTrainer through the one-minute workout against the production
  # web build and the Go API, and floats the HUD (packaged.spec.js).
  #
  # Linux and unsigned here: a pull request gets no signing secrets, and a
  # signed macOS build costs a notarization per push. The signed build rides
  # the same spec in desktop-release.yml's `ride` job, before anything is
  # published.
  packaged:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          POSTGRES_DB: wattroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Not `pnpm/setup` — see the note in ci.yml's `web` job (#2375).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: fetch the Electron binary
        working-directory: desktop
        run: test -d node_modules/electron/dist || node node_modules/electron/install.js
      # The unpacked app is what the installers wrap; `dir` skips the
      # AppImage and deb, which this job would only unpack again.
      - name: build the shell
        working-directory: desktop
        env:
          GH_TOKEN: ''
        run: pnpm exec electron-builder --linux dir --publish never
      - name: the fuses are off
        working-directory: desktop
        run: node fuses-check.js dist/linux-unpacked/wattroom-desktop
      # What the .deb's postinst does on a rider's machine: the runner's
      # AppArmor refuses unprivileged user namespaces, so Chromium needs its
      # setuid helper or aborts at launch. Not --no-sandbox: that would ride a
      # build no rider runs.
      - name: the sandbox helper, as the .deb installs it
        working-directory: desktop
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
      # The server the e2e job rides against: the production web build behind
      # web/e2e/server.js, which proxies /api and /ws to `go run`. No LiveKit:
      # an empty URL turns AV off rather than pointing at nothing.
      - name: start the server
        env:
          WATTROOM_DB: postgres://wattroom:wattroom@localhost:5432/wattroom
          WATTROOM_LIVEKIT_URL: ''
        run: |
          eval "$(sh scripts/dev-env.sh print)"
          echo "WATTROOM_URL=http://localhost:$WATTROOM_E2E_WEB_PORT" >> "$GITHUB_ENV"
          (cd web && pnpm build)
          (cd web && nohup node e2e/server.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for _ in $(seq 1 240); do
            curl -fsS -o /dev/null "http://localhost:$WATTROOM_E2E_WEB_PORT/ride" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log" >&2
          echo "::error::the server never answered" >&2
          exit 1
      - name: ride the packaged shell
        working-directory: desktop
        env:
          WATTROOM_APP_BINARY: dist/linux-unpacked/wattroom-desktop
        run: xvfb-run --auto-servernum pnpm exec playwright test -c packaged.config.js
      - name: server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: desktop-packaged-results
          path: desktop/test-results/
          retention-days: 7
