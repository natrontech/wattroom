# The world's mutants (#3222): web/scripts/world-mutants.mjs re-injects each
# known way the generator has gone wrong and fails if no gate in
# web/src/lib/world goes red. About 20 minutes, so it runs only on changes to
# the world. Advisory: no ruleset requires it. The report is attached as
# `world-mutants`.
name: world-mutants

on:
  push:
    branches: [main]
    paths:
      - 'web/src/lib/world/**'
      - 'web/scripts/world-mutants.mjs'
      - '.github/workflows/world-mutants.yml'
  pull_request:
    paths:
      - 'web/src/lib/world/**'
      - 'web/scripts/world-mutants.mjs'
      - '.github/workflows/world-mutants.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: see the note in ci.yml (#2806).
permissions:
  contents: read

jobs:
  world-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not `pnpm/setup` — see the note in ci.yml's `web` job (#2375).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: node scripts/world-mutants.mjs --report world-mutants.md
        working-directory: web
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-mutants
          path: web/world-mutants.md
          if-no-files-found: ignore
