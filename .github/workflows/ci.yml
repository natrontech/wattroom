name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly vuln scan — new CVEs appear after code ships

# A push to a PR makes the run already in flight worthless. Agents push in
# bursts, so those obsolete runs were most of the queue. main is never
# cancelled: each merge commit keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          POSTGRES_DB: wattroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server
      - run: go build ./...
      - run: go test -race ./...
        env:
          WATTROOM_TEST_DB: postgres://wattroom:wattroom@localhost:5432/wattroom
      - name: protocol types are up to date
        run: |
          go tool tygo generate
          git diff --exit-code ../web/src/lib/protocol.ts

  # Six of the seven changes in 2026.09.2 shipped with no changelog line, so
  # the release notes described one of them. A rule nobody checks is not a
  # rule — agents merge in parallel and none of them will notice.
  #
  # The entry is a file per PR (changelog.d/) rather than a shared section:
  # eight agents editing the same lines conflicted constantly, and a conflict
  # resolved carelessly during a rebase drops somebody's entry silently.
  changelog:
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: a rider-visible change needs a changelog line
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if ! grep -qE '^(server/|web/src/)' <<<"$changed"; then
            echo "No server/ or web/src change — nothing to announce."
            exit 0
          fi
          if grep -qE '^changelog\.d/(added|changed|deprecated|removed|fixed|security)-' <<<"$changed"; then
            echo "Changelog entry present."
            exit 0
          fi
          if grep -qE '^changelog\.d/' <<<"$changed"; then
            echo 'A changelog.d/ file was added but its name does not start with a' >&2
            echo 'category, so the release step would drop it silently.' >&2
            exit 1
          fi
          cat >&2 <<'MSG'
          This PR changes server/ or web/src but adds no changelog entry.

          Add one file — not an edit to CHANGELOG.md, which every agent would
          then conflict on:

              changelog.d/<category>-<slug>.md

          category is added / changed / deprecated / removed / fixed / security.
          The file holds the bullet as it should appear, written for someone
          deciding whether to upgrade. See changelog.d/README.md.

          If the change genuinely cannot be seen by a rider — tooling, tests,
          refactors — apply the `no-changelog` label instead.
          MSG
          exit 1

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: server
          go-version-file: server/go.mod

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
