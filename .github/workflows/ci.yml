name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly vuln scan — new CVEs appear after code ships

# A push to a PR makes the run already in flight worthless. Agents push in
# bursts, so those obsolete runs were most of the queue. main is never
# cancelled: each merge commit keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only, and this is the canonical note for every workflow here (#2806).
# A workflow that names no permissions inherits the repository default, which
# can write contents, packages, actions and issues — and every job below runs
# other people's code with that token in reach: pnpm install, svelte-check,
# vitest, go test over third-party modules. One compromised package could then
# push an image to ghcr.io/natrontech/wattroom under the next CalVer tag, or
# cut a Release. Nothing in this file writes, so nothing gets more; a job that
# does write widens its own block, as publish.yml's image job does, never the
# top. The config job below fails a workflow that forgets.
#
# Every checkout sets `persist-credentials: false` for the same reason: no job
# pushes with git, and without it the token stays in .git/config for every
# later step to read. That is defence in depth only — a process on the runner
# can still find the token in memory — so the block below is what matters.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          # wattroom_test, the name storetest defaults to (#1718): one name for
          # the destructive suite everywhere, never the dev database's.
          POSTGRES_DB: wattroom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      # One version for both gates (#716): the Makefile defines it, this
      # reads it. Without it the action takes `latest`, so `make lint`
      # passed on findings CI then rejected.
      - id: linter
        working-directory: .
        run: echo "version=$(make -s print-golangci-version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: server
          version: ${{ steps.linter.outputs.version }}
      - run: go build ./...
      # -shuffle surfaces order dependence between tests now rather than at
      # the next file reorder; -timeout caps a wedged package at 5 min.
      - run: go test -race -shuffle=on -timeout=5m ./...
        env:
          WATTROOM_TEST_DB: postgres://wattroom:wattroom@localhost:5432/wattroom_test
          # The service container above exists so these tests run against it.
          # Without this, an unreachable database is 17 skips and a green job
          # rather than a failure (#814).
          WATTROOM_REQUIRE_DB: '1'
      # Garmin's own decoder over the exported .fit files (#2330, ADR-0088).
      # The Go tests read them back with the library that wrote them, so a
      # mistake the two share passes there. TestGoldenFile pins these files
      # to what Encode writes, so a change to the export reaches this step.
      - name: the FIT export decodes with Garmin's FIT SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/fitsdk"
          "$RUNNER_TEMP/fitsdk/bin/pip" install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r ../scripts/fit-sdk-requirements.txt
          "$RUNNER_TEMP/fitsdk/bin/python" -I ../scripts/fit-sdk-check.py internal/fitexport/testdata/*.fit
      - name: protocol types are up to date
        run: |
          go tool tygo generate
          git diff --exit-code ../web/src/lib/protocol.ts
      # Third-party notices (#1670): MIT, ISC, BSD, Apache and the OFL all
      # require the notice to travel with the artifact. Same shape as the
      # protocol check above — generated, committed, and CI fails on drift, so
      # a new dependency cannot ship unnamed. Split by toolchain: this job has
      # Go, the web job has pnpm, and neither needs the other installed.
      - name: third-party notices cover what the binary links
        run: |
          python3 ../scripts/licenses-go.py
          git diff --exit-code ../web/static/legal/go.json

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          work-dir: server
          go-version-file: server/go.mod

  # Workflow and deploy config: actions pinned to a commit, every workflow
  # starts from a read-only token, and the alert rules fire on real series.
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every action is pinned to a commit, never to a tag. A tag is a movable
      # pointer in somebody else's repository: whoever can push to it can
      # replace the code inside every job here, on every branch, with the
      # secrets those jobs hold — which is exactly how tj-actions/changed-files
      # was turned against thousands of repositories in 2025, by repointing
      # tags that had never changed before. A commit SHA cannot be repointed.
      #
      # The trailing `# vX.Y.Z` is required too, not decoration: a bare SHA
      # tells a reader nothing about how old it is, and it is the comment
      # Dependabot rewrites when it bumps the pin.
      - name: Actions are pinned to a commit, not a tag
        run: |
          # `uses: ./…` is a local action in this repo and needs no pin.
          unpinned=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/ \
                     | grep -vE 'uses:[[:space:]]+\./' \
                     | grep -vE 'uses:[[:space:]]+[^[:space:]]+@[0-9a-f]{40}[[:space:]]+#[[:space:]]*v' || true)
          if [ -n "$unpinned" ]; then
            echo 'These actions are not pinned to a commit SHA with a version comment:' >&2
            echo "$unpinned" >&2
            cat >&2 <<'MSG'

          A tag is a pointer in someone else's repository and can be moved onto
          different code without warning. Pin the commit and name the release:

              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          Resolve a tag to its commit with:

              gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha

          If that prints the SHA of an annotated tag object rather than a
          commit, dereference it once more with git/tags/<sha>. Dependabot
          keeps the pin current from then on.
          MSG
            exit 1
          fi
          echo "Every action is pinned to a commit."

      # Keeps the permissions note at the top of this file true (#2806). A new
      # workflow written out of habit names no permissions, inherits the
      # repository's write default, and hands it to every dependency its jobs
      # install — silently, because every job still goes green. So every
      # workflow says what its token may do at the top, and the top never
      # grants a write: that is the job's own block, where the reason can sit
      # beside it. 
      - name: Every workflow starts from a read-only token
        run: |
          bad=()
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            # Column 0 is YAML's top level; the block ends at the next key.
            verdict=$(awk '
              { sub(/#.*/, "") }
              /^permissions:/ { found = 1; top = 1; if (/write/) wide = 1; next }
              top && /^[^[:space:]]/ { top = 0 }
              top && /:[[:space:]]*write/ { wide = 1 }
              END { print (!found ? "missing" : wide ? "write" : "ok") }
            ' "$f")
            case "$verdict" in
              missing) bad+=("$f names no top-level permissions") ;;
              write) bad+=("$f grants a write at the top level") ;;
            esac
          done
          if [ ${#bad[@]} -gt 0 ]; then
            printf '    %s\n' "${bad[@]}" >&2
            cat >&2 <<'MSG'

          A workflow that names no permissions inherits the repository default,
          which can write contents, packages, actions and issues, and a write
          granted at the top reaches every job in the file, including the ones
          that install and run other people's code. Start from read, and widen
          only the job that writes:

              permissions:
                contents: read

              jobs:
                release:
                  permissions:
                    contents: write # gh release create

          A workflow that never uses GITHUB_TOKEN takes `permissions: {}`.
          MSG
            exit 1
          fi
          echo "Every workflow starts from a read-only token."

      # A rule that selects a label the scrape never produces does not fail. It
      # stays silent, exactly like a healthy one, and the job-staleness rules
      # did that from the day they were written (#2679). Same promtool as the homelab Prometheus
      # that runs wattroom.ch's copy of these rules.
      - name: Alert rules fire on the series a real scrape produces
        run: |
          docker run --rm -v "$PWD/deploy:/rules:ro" -w /rules --entrypoint promtool \
            prom/prometheus:v3.14.0@sha256:e906cef998316bbe319f98711e1b4d8613ad37e14b08ff831d7036e77b7464f9 \
            test rules alerts.test.yml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not `pnpm/setup`, and this is the canonical note for all five call
      # sites (#2375). `pnpm/setup` is real and maintained, but it is not the
      # successor this action was briefly said to have: action-setup's README
      # settled on "you can continue using `pnpm/action-setup` with
      # `actions/setup-node`, including for pnpm v11 and v12", and v6.1.0
      # shipped pnpm 12 support a month after the note #2375 was opened on.
      #
      # It is also not available to us. `pnpm/setup@v2` installs pnpm v11 and
      # newer only — it wants the self-contained release binary and the `pnpm
      # runtime` command, and both manifests here pin `pnpm@10.32.1`. Upstream
      # sends pnpm 10 back to this action by name. So the swap is not a rename:
      # it is a pnpm major bump for `web/` and `desktop/` first, which is a
      # judgement call of its own and not a CI chore.
      #
      # When that bump happens, the rest is small. `pnpm/setup` reads
      # `packageManager` from the manifest exactly as this does, so the single
      # source of truth survives — but the input is spelled `package-json-file`
      # (hyphens) and is already deprecated in favour of `working-directory`,
      # which is what to reach for. It also installs a runtime and runs `pnpm
      # install` itself, so it replaces `actions/setup-node` and the install
      # step rather than sitting beside them — and `web-node-next` below wants
      # a Node this repo's manifests do not name, so that job would pass
      # `runtime: node@26` explicitly.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run format:check
      - name: third-party notices cover what the SPA bundles
        run: |
          node ../scripts/licenses-web.mjs
          git diff --exit-code static/legal/web.json
      - run: pnpm run test
      - run: pnpm run build
      - name: three.js stays out of the eager shell and the (site) pages
        run: node scripts/bundle-check.mjs
