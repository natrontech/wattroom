name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly vuln scan — new CVEs appear after code ships

# A push to a PR makes the run already in flight worthless. Agents push in
# bursts, so those obsolete runs were most of the queue. main is never
# cancelled: each merge commit keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          POSTGRES_DB: wattroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      # One version for both gates (#716): the Makefile defines it, this
      # reads it. Without it the action takes `latest`, so `make lint`
      # passed on findings CI then rejected.
      - id: linter
        run: echo "version=$(make -s print-golangci-version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server
          version: ${{ steps.linter.outputs.version }}
      - run: go build ./...
      - run: go test -race ./...
        env:
          WATTROOM_TEST_DB: postgres://wattroom:wattroom@localhost:5432/wattroom
      - name: protocol types are up to date
        run: |
          go tool tygo generate
          git diff --exit-code ../web/src/lib/protocol.ts

  # Six of the seven changes in 2026.09.2 shipped with no changelog line, so
  # the release notes described one of them. A rule nobody checks is not a
  # rule — agents merge in parallel and none of them will notice.
  #
  # The entry is a file per PR (changelog.d/) rather than a shared section:
  # eight agents editing the same lines conflicted constantly, and a conflict
  # resolved carelessly during a rebase drops somebody's entry silently.
  changelog:
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changelog') &&
      !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # An entry that does not begin with "- " is not a list item, so Markdown
      # folds it into the bullet above it: four fixes in 2026.09.15's notes
      # were hidden inside other fixes that way (#546). `make release`
      # normalises now, but the file is what its author reads back, so it
      # should be a bullet on the page too.
      - name: a changelog entry is a list item
        run: |
          bad=()
          while IFS= read -r f; do
            [ "$f" = changelog.d/README.md ] && continue
            case "$(awk 'NF {print; exit}' "$f")" in
              '- '*) ;;
              *) bad+=("$f") ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'changelog.d/*.md')

          if [ ${#bad[@]} -gt 0 ]; then
            printf 'This changelog entry does not start with "- ":\n\n' >&2
            printf '    %s\n' "${bad[@]}" >&2
            cat >&2 <<'MSG'

          The release notes are a list, so an entry without its leading dash
          gets folded into the bullet above it and the change disappears
          inside somebody else's. Start the file with "- " and indent
          continuation lines by two spaces:

              - What's new no longer goes blank. Any release note that used
                the same code span twice took the whole page down with it.

          See changelog.d/README.md.
          MSG
            exit 1
          fi
          echo "Changelog entries are list items."

      - name: a rider-visible change needs a changelog line
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

          # CHANGELOG.md is generated from changelog.d/ at release time. Editing
          # it by hand puts text where nothing will ever read it — the entry
          # never reaches a release and just sits there looking published.
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo 'This PR edits CHANGELOG.md by hand.' >&2
            echo '' >&2
            echo 'That file is collated from changelog.d/ when a release is cut, so an' >&2
            echo 'entry added here is never read and never ships. Put it in' >&2
            echo 'changelog.d/<category>-<slug>.md instead — see changelog.d/README.md.' >&2
            exit 1
          fi

          if ! grep -qE '^(server/|web/src/)' <<<"$changed"; then
            echo "No server/ or web/src change — nothing to announce."
            exit 0
          fi
          if grep -qE '^changelog\.d/(added|changed|deprecated|removed|fixed|security)-' <<<"$changed"; then
            echo "Changelog entry present."
            exit 0
          fi
          if grep -qE '^changelog\.d/' <<<"$changed"; then
            echo 'A changelog.d/ file was added but its name does not start with a' >&2
            echo 'category, so the release step would drop it silently.' >&2
            exit 1
          fi
          cat >&2 <<'MSG'
          This PR changes server/ or web/src but adds no changelog entry.

          Add one file — not an edit to CHANGELOG.md, which every agent would
          then conflict on:

              changelog.d/<category>-<slug>.md

          category is added / changed / deprecated / removed / fixed / security.
          The file holds the bullet as it should appear, written for someone
          deciding whether to upgrade. See changelog.d/README.md.

          If the change genuinely cannot be seen by a rider — tooling, tests,
          refactors — apply the `no-changelog` label instead.
          MSG
          exit 1

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: server
          go-version-file: server/go.mod

  # Three ADRs once claimed 0019 at once (#379) — a duplicate number is a
  # silent footgun (links and citations become ambiguous) that nothing else
  # catches, so it gets its own gate.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ADR numbers are unique
        run: |
          dupes=$(ls docs/decisions/ | cut -d- -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate ADR number(s): $dupes" >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
