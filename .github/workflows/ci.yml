name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly vuln scan — new CVEs appear after code ships

# A push to a PR makes the run already in flight worthless. Agents push in
# bursts, so those obsolete runs were most of the queue. main is never
# cancelled: each merge commit keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          POSTGRES_DB: wattroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server
      - run: go build ./...
      - run: go test -race ./...
        env:
          WATTROOM_TEST_DB: postgres://wattroom:wattroom@localhost:5432/wattroom
      - name: protocol types are up to date
        run: |
          go tool tygo generate
          git diff --exit-code ../web/src/lib/protocol.ts

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: server
          go-version-file: server/go.mod

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
