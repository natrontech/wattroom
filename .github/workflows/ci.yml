name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly vuln scan — new CVEs appear after code ships

# A push to a PR makes the run already in flight worthless. Agents push in
# bursts, so those obsolete runs were most of the queue. main is never
# cancelled: each merge commit keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          # wattroom_test, the name storetest defaults to (#1718): one name for
          # the destructive suite everywhere, never the dev database's.
          POSTGRES_DB: wattroom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      # One version for both gates (#716): the Makefile defines it, this
      # reads it. Without it the action takes `latest`, so `make lint`
      # passed on findings CI then rejected.
      - id: linter
        run: echo "version=$(make -s print-golangci-version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: server
          version: ${{ steps.linter.outputs.version }}
      - run: go build ./...
      # -shuffle surfaces order dependence between tests now rather than at
      # the next file reorder; -timeout caps a wedged package at 5 min.
      - run: go test -race -shuffle=on -timeout=5m ./...
        env:
          WATTROOM_TEST_DB: postgres://wattroom:wattroom@localhost:5432/wattroom_test
          # The service container above exists so these tests run against it.
          # Without this, an unreachable database is 17 skips and a green job
          # rather than a failure (#814).
          WATTROOM_REQUIRE_DB: '1'
      - name: protocol types are up to date
        run: |
          go tool tygo generate
          git diff --exit-code ../web/src/lib/protocol.ts
      # Third-party notices (#1670): MIT, ISC, BSD, Apache and the OFL all
      # require the notice to travel with the artifact. Same shape as the
      # protocol check above — generated, committed, and CI fails on drift, so
      # a new dependency cannot ship unnamed. Split by toolchain: this job has
      # Go, the web job has pnpm, and neither needs the other installed.
      - name: third-party notices cover what the binary links
        run: |
          python3 ../scripts/licenses-go.py
          git diff --exit-code ../web/static/legal/go.json

  # Six of the seven changes in 2026.09.2 shipped with no changelog line, so
  # the release notes described one of them. A rule nobody checks is not a
  # rule — agents merge in parallel and none of them will notice.
  #
  # The entry is a file per PR (changelog.d/) rather than a shared section:
  # eight agents editing the same lines conflicted constantly, and a conflict
  # resolved carelessly during a rebase drops somebody's entry silently.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          work-dir: server
          go-version-file: server/go.mod

  # Three ADRs once claimed 0019 at once (#379) — a duplicate number is a
  # silent footgun (links and citations become ambiguous) that nothing else
  # catches, so it gets its own gate. The index and link checks (#674) guard
  # the other way the chain breaks: an ADR nobody can find, or an amendment
  # pointer at a file that never existed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ADR numbers are unique
        run: |
          dupes=$(ls docs/decisions/ | cut -d- -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate ADR number(s): $dupes" >&2
            exit 1
          fi
      - name: Every ADR is listed in docs/decisions/README.md
        run: |
          missing=""
          for f in docs/decisions/[0-9]*.md; do
            name=$(basename "$f")
            grep -qF "($name)" docs/decisions/README.md || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "ADR file(s) missing from docs/decisions/README.md:$missing" >&2
            exit 1
          fi
      # ADR-0050: a frozen statement is never rewritten, only annotated — and an
      # annotation is worth little without the date and the issue or ADR that
      # earned it, which exactly one of the six markings already in the file
      # carries. Unanchored on purpose: the founding record is prose *and* a
      # 48-row table, and a blockquote cannot live inside a table cell, so the
      # marker appears both at the start of a line and inside one.
      - name: Divergence annotations name where they happened
        run: |
          bad=$(grep -rn '\*\*Diverged' WATTROOM.md docs/decisions/ \
                | grep -vE 'Diverged [0-9]{4}-[0-9]{2}-[0-9]{2} \([^)]*(#[0-9]+|ADR-[0-9]{4})' || true)
          if [ -n "$bad" ]; then
            echo 'A divergence annotation must read:' >&2
            echo '    > **Diverged YYYY-MM-DD (#issue, ADR-nnnn)** — the argument, in plain words' >&2
            echo 'These do not:' >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "Divergence annotations are well formed."

      # WATTROOM.md and the top-level docs are in scope too, not just the ADRs
      # (#2055): docs/ROADMAP.md alone carries 36 links into docs/decisions/,
      # and eight of them were written against guessed filenames that the old
      # docs/decisions-only loop could never have seen.
      - name: Relative links in the docs resolve
        run: |
          broken=""
          for f in docs/decisions/*.md docs/*.md WATTROOM.md AGENTS.md; do
            [ -e "$f" ] || continue
            for target in $(grep -oE '\]\([^)]+\)' "$f" | sed -E 's/^\]\(//; s/\)$//; s/[ #].*$//' | grep -vE '^([a-z]+:|$)'); do
              [ -e "$(dirname "$f")/$target" ] || broken="$broken $f->$target"
            done
          done
          if [ -n "$broken" ]; then
            echo "Broken relative link(s):$broken" >&2
            exit 1
          fi

      # Every action is pinned to a commit, never to a tag. A tag is a movable
      # pointer in somebody else's repository: whoever can push to it can
      # replace the code inside every job here, on every branch, with the
      # secrets those jobs hold — which is exactly how tj-actions/changed-files
      # was turned against thousands of repositories in 2025, by repointing
      # tags that had never changed before. A commit SHA cannot be repointed.
      #
      # This lives in `docs` because `docs` is required on main's ruleset and
      # runs on every PR regardless of paths. One agent adding `@v4` out of
      # habit silently undoes the whole thing, and nothing else would notice.
      #
      # The trailing `# vX.Y.Z` is required too, not decoration: a bare SHA
      # tells a reader nothing about how old it is, and it is the comment
      # Dependabot rewrites when it bumps the pin.
      - name: Actions are pinned to a commit, not a tag
        run: |
          # `uses: ./…` is a local action in this repo and needs no pin.
          unpinned=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/ \
                     | grep -vE 'uses:[[:space:]]+\./' \
                     | grep -vE 'uses:[[:space:]]+[^[:space:]]+@[0-9a-f]{40}[[:space:]]+#[[:space:]]*v' || true)
          if [ -n "$unpinned" ]; then
            echo 'These actions are not pinned to a commit SHA with a version comment:' >&2
            echo "$unpinned" >&2
            cat >&2 <<'MSG'

          A tag is a pointer in someone else's repository and can be moved onto
          different code without warning. Pin the commit and name the release:

              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          Resolve a tag to its commit with:

              gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha

          If that prints the SHA of an annotated tag object rather than a
          commit, dereference it once more with git/tags/<sha>. Dependabot
          keeps the pin current from then on.
          MSG
            exit 1
          fi
          echo "Every action is pinned to a commit."

  # A migration whose timestamp precedes the newest already on main is not an
  # error and this job never fails (#1481). Two branches cut from the same main
  # stamp timestamps minutes apart, the later-written one merges first, and the
  # server applies the other one late at the next boot — safe by construction
  # under ADR-0019's expand-only rule, as the amendment there of 2026-09-17
  # records. What the author still wants to know is that it happened, because
  # that rule is enforced by nobody: a migration quietly assuming the schema
  # left by a file it now runs *before* is the one case the option does not
  # cover.
  #
  # Deliberately not a gate. `strict_required_status_checks_policy` is false on
  # main's ruleset, so a blocking check would not even close the race it names:
  # the losing branch is green against the main it was cut from and never
  # re-runs against the winner's file. Turning that on costs a rebase and a
  # full CI re-run per merge, in a repo where many agents merge in parallel.
  # The step exits 0 by construction, so this warns however the job is
  # configured; `continue-on-error` only covers a bug in the step itself, and
  # the job's name is deliberately not one of the ruleset's required contexts
  # (server, web, vulncheck, docs).
  migration-order:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: a new migration older than the base branch's newest
        run: |
          dir=server/internal/store/migrations
          newest=$(git ls-tree -r --name-only "origin/${{ github.base_ref }}" -- "$dir" \
                   | sed -n 's#.*/\([0-9]\{1,\}\)_.*\.sql$#\1#p' | sort -n | tail -1)
          if [ -z "$newest" ]; then
            echo "No migrations on ${{ github.base_ref }} to compare against."
            exit 0
          fi
          # 10# because the original migrations are 000NN and bash reads a
          # leading zero as octal, in which 00009 is not a number at all.
          newest=$((10#$newest))

          late=0
          while IFS= read -r f; do
            version=$(basename "$f" | sed -n 's#^\([0-9]\{1,\}\)_.*#\1#p')
            [ -n "$version" ] || continue
            [ "$((10#$version))" -lt "$newest" ] || continue
            late=1
            echo "::warning file=$f::This migration is stamped $version, older than $newest which is already on ${{ github.base_ref }}. The server applies it out of order at its next boot (goose WithAllowMissing, ADR-0019 amended 2026-09-17), so this is not a blocker — but check that it only ADDS, and does not read or depend on anything $newest left behind. If it does, take a fresh name with \`make migration name=<slug>\` and move the body across."
          done < <(git diff --name-only --diff-filter=AR "origin/${{ github.base_ref }}...HEAD" -- "$dir")

          if [ "$late" -eq 0 ]; then
            echo "No migration here predates $newest on ${{ github.base_ref }}."
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not `pnpm/setup`, and this is the canonical note for all five call
      # sites (#2375). `pnpm/setup` is real and maintained, but it is not the
      # successor this action was briefly said to have: action-setup's README
      # settled on "you can continue using `pnpm/action-setup` with
      # `actions/setup-node`, including for pnpm v11 and v12", and v6.1.0
      # shipped pnpm 12 support a month after the note #2375 was opened on.
      #
      # It is also not available to us. `pnpm/setup@v2` installs pnpm v11 and
      # newer only — it wants the self-contained release binary and the `pnpm
      # runtime` command, and both manifests here pin `pnpm@10.32.1`. Upstream
      # sends pnpm 10 back to this action by name. So the swap is not a rename:
      # it is a pnpm major bump for `web/` and `desktop/` first, which is a
      # judgement call of its own and not a CI chore.
      #
      # When that bump happens, the rest is small. `pnpm/setup` reads
      # `packageManager` from the manifest exactly as this does, so the single
      # source of truth survives — but the input is spelled `package-json-file`
      # (hyphens) and is already deprecated in favour of `working-directory`,
      # which is what to reach for. It also installs a runtime and runs `pnpm
      # install` itself, so it replaces `actions/setup-node` and the install
      # step rather than sitting beside them — and `web-node-next` below wants
      # a Node this repo's manifests do not name, so that job would pass
      # `runtime: node@26` explicitly.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run format:check
      - name: third-party notices cover what the SPA bundles
        run: |
          node ../scripts/licenses-web.mjs
          git diff --exit-code static/legal/web.json
      - run: pnpm run test
      - run: pnpm run build

  # The same suite on the Node the `web` job above does not run (#2074).
  #
  # Node 24 is the Active LTS and stays the gate. Node 26 is Current, and it
  # became the version contributors actually have: four `web` tests were red on
  # a clean `main` for everyone on 26 and green here for a week, because Node 26
  # ships the Web Storage globals and vitest's happy-dom environment then
  # declines to install its own (#2058, fixed in #2073). CI could not have found
  # that, and the loud four tests were the better half — the storage-backed
  # stores guard on `typeof localStorage === 'undefined'`, so the rest of the
  # suite took the no-storage branch and *passed on default data*. Any future
  # Node that lands a web global can shadow happy-dom the same silent way, so
  # the durable answer is to run the suite on more than one Node rather than to
  # pin one.
  #
  # Advisory, not a gate: `continue-on-error` keeps a Node-26 regression in a
  # dependency from blocking every unrelated PR in the repo, and this job's name
  # is deliberately not `web` — it is not in the branch ruleset's required
  # contexts (server, web, vulncheck, docs), and a matrix on the job above would
  # have renamed that required `web` context to `web (24)` and wedged every
  # merge. Whether this should graduate to a blocking check is a risk-appetite
  # call left open on #2074.
  #
  # Only `pnpm run test`: `check`, `format:check`, the notices and `build` do
  # not vary with the interpreter the way the test environment does, and
  # duplicating them doubles the job for no new signal.
  #
  # When 26 becomes the Active LTS, it moves up into the `web` job and this one
  # takes the next Current. One version to edit, in the `node-version` below.
  web-node-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not `pnpm/setup` — see the note in ci.yml's `web` job (#2375).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
