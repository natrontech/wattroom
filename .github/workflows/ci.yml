name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly vuln scan — new CVEs appear after code ships

# A push to a PR makes the run already in flight worthless. Agents push in
# bursts, so those obsolete runs were most of the queue. main is never
# cancelled: each merge commit keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wattroom
          POSTGRES_PASSWORD: wattroom
          POSTGRES_DB: wattroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wattroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      # One version for both gates (#716): the Makefile defines it, this
      # reads it. Without it the action takes `latest`, so `make lint`
      # passed on findings CI then rejected.
      - id: linter
        run: echo "version=$(make -s print-golangci-version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server
          version: ${{ steps.linter.outputs.version }}
      - run: go build ./...
      # -shuffle surfaces order dependence between tests now rather than at
      # the next file reorder; -timeout caps a wedged package at 5 min.
      - run: go test -race -shuffle=on -timeout=5m ./...
        env:
          WATTROOM_TEST_DB: postgres://wattroom:wattroom@localhost:5432/wattroom
          # The service container above exists so these tests run against it.
          # Without this, an unreachable database is 17 skips and a green job
          # rather than a failure (#814).
          WATTROOM_REQUIRE_DB: '1'
      - name: protocol types are up to date
        run: |
          go tool tygo generate
          git diff --exit-code ../web/src/lib/protocol.ts

  # Six of the seven changes in 2026.09.2 shipped with no changelog line, so
  # the release notes described one of them. A rule nobody checks is not a
  # rule — agents merge in parallel and none of them will notice.
  #
  # The entry is a file per PR (changelog.d/) rather than a shared section:
  # eight agents editing the same lines conflicted constantly, and a conflict
  # resolved carelessly during a rebase drops somebody's entry silently.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: server
          go-version-file: server/go.mod

  # Three ADRs once claimed 0019 at once (#379) — a duplicate number is a
  # silent footgun (links and citations become ambiguous) that nothing else
  # catches, so it gets its own gate. The index and link checks (#674) guard
  # the other way the chain breaks: an ADR nobody can find, or an amendment
  # pointer at a file that never existed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ADR numbers are unique
        run: |
          dupes=$(ls docs/decisions/ | cut -d- -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate ADR number(s): $dupes" >&2
            exit 1
          fi
      - name: Every ADR is listed in docs/decisions/README.md
        run: |
          missing=""
          for f in docs/decisions/[0-9]*.md; do
            name=$(basename "$f")
            grep -qF "($name)" docs/decisions/README.md || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "ADR file(s) missing from docs/decisions/README.md:$missing" >&2
            exit 1
          fi
      - name: Relative links in docs/decisions resolve
        run: |
          broken=""
          for f in docs/decisions/*.md; do
            for target in $(grep -oE '\]\([^)]+\)' "$f" | sed -E 's/^\]\(//; s/\)$//; s/[ #].*$//' | grep -vE '^([a-z]+:|$)'); do
              [ -e "$(dirname "$f")/$target" ] || broken="$broken $f->$target"
            done
          done
          if [ -n "$broken" ]; then
            echo "Broken relative link(s) in docs/decisions:$broken" >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
