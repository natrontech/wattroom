# Multi-arch image publish to GHCR (#36). Every push to main builds :main, for
# testing. A v* tag builds the immutable :vX.Y.Z the VM actually pins and cuts
# the GitHub Release whose generated notes are the changelog (ADR-0019) —
# "built" and "blessed" are deliberately not the same event.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      packages: write
    steps:
      - uses: actions/checkout@v4
      # No QEMU: the Dockerfile cross-compiles for arm64 natively.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One expression per line decides tag-vs-branch; a metadata action would
      # be a new dependency to do exactly this much.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Last, so a release never names an image that failed to push. PR titles
      # are conventional commits and merges are squashes, so GitHub writes the
      # notes off the commit range — there is no changelog tooling here.
      - name: cut the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
