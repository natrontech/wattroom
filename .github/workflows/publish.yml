# Multi-arch image publish to GHCR (#36). Every push to main builds :main, for
# testing. A CalVer tag builds the immutable :YYYY.0M.MICRO the VM pins and cuts
# the GitHub Release whose generated notes are the changelog (ADR-0019) —
# "built" and "blessed" are deliberately not the same event.
name: publish

on:
  push:
    branches: [main]
    tags: ['20*'] # CalVer: 2026.09.1 — scripts/release.sh is the real validator

# :main is a rolling tag — the next merge overwrites it, so a build overtaken
# mid-flight is two minutes of multi-arch work nobody will ever pull. Tags are
# immutable releases and get their own group, never cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      packages: write
    steps:
      - uses: actions/checkout@v5
      # No QEMU: the Dockerfile cross-compiles for arm64 natively.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One expression per line decides tag-vs-branch; a metadata action would
      # be a new dependency to do exactly this much.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A named volume takes its ownership from the image path it covers, so
      # /data/tracks and /data/feedback have to exist in the image and belong
      # to the uid the server runs as. Without them a mounted volume is
      # created root-owned and every write into it fails at runtime, on a
      # container that starts and answers /api/healthz — which is why this is
      # checked against the built image rather than reviewed in the Dockerfile
      # (#1730: it went unnoticed in production for ten days).
      - name: a fresh volume belongs to the app's uid
        run: |
          image=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker volume create probe-volume >/dev/null
          # Creating the container is what initialises the volume; the
          # entrypoint never has to run, and must not — it wants a database.
          docker run --rm --entrypoint /nonexistent -v probe-volume:/data/tracks "$image" || true
          owner=$(docker run --rm -v probe-volume:/probe alpine stat -c '%u:%g' /probe)
          docker volume rm probe-volume >/dev/null
          if [ "$owner" != "65532:65532" ]; then
            echo "a fresh volume came out owned by $owner — the server runs as 65532 and cannot write to it"
            exit 1
          fi

      # Last, so a release never names an image that failed to push. The notes
      # are the CHANGELOG section this tag was cut with (`make release` writes
      # it before tagging), so the Release and the file cannot disagree — and
      # neither is a commit-log dump.
      - name: cut the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stop at the next heading *or* the link-reference block: the oldest
          # section has no heading after it, and the first release ever is
          # that section.
          awk -v v="$GITHUB_REF_NAME" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ || /^\[[^]]+\]:/ { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || {
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME — was it tagged with make release?" >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
