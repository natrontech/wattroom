# Dependency updates, in place of the Renovate that was never installed (#9,
# #2343). renovate.json sat in the repo root from the first CI commit and
# opened exactly zero pull requests in two months, because Renovate is a GitHub
# App and nobody installed it. Dependabot is native: this file on the default
# branch is the whole activation. Two bots on one repo means two PRs per bump,
# so renovate.json goes rather than both staying.
#
# The design goal is a mailbox worth reading. Monthly, one grouped PR per
# ecosystem for everything minor and patch, a hard cap on how many can be open
# — so a quiet month is one PR against `web` and nothing else, and a loud one
# still cannot bury the board. Majors deliberately arrive alone: each is a
# judgement call and wants its own red-or-green.
#
# Security updates ignore all of this. Dependabot opens those immediately,
# outside the schedule and outside the open-PR limit, which is the correct
# asymmetry — see `vulncheck` in ci.yml for the Go half of the same job.
#
# The `docker` ecosystem moves the Dockerfile's digests (#2866). Every FROM is
# pinned by digest, because the node and golang stages are not "builders
# discarded": they produce the SPA and the binary that ship, so a moved tag
# reached production with nothing here changing. The node and golang TAGS stay
# a human's edit — the Node major tracks ci.yml's `web` job and the Go version
# tracks go.mod — so the bot is told to ignore every version change on those
# two and propose digests only. The distroless runtime moves freely.
#
# A hand-sweep of web/ wedges the npm updater for three days, and the error
# names the wrong package. Dependabot resolves the pnpm lockfile with
# `--config.minimumReleaseAge=4320` — a 72-hour maturity gate — and pnpm
# applies that to every direct dependency in the file, not only the one being
# updated. So the very first run after #2344 failed like this:
#
#     ERR_PNPM_NO_MATURE_MATCHING_VERSION  Version 3.9.7 (released 35 hours
#     ago) of prettier does not meet the minimumReleaseAge constraint
#
# on a job whose subject was vitest. #2344's sweep had taken prettier 3.9.7 the
# day after it was published, so nothing in web/ could resolve until it turned
# three days old. Nothing to fix and nothing to configure: it clears itself,
# the other three ecosystems are unaffected, and a monthly schedule almost
# never lands inside the window. Worth knowing so the next red run is read in
# ten seconds rather than debugged — if you sweep by hand, expect this, and
# read the failing package name as "something in the lockfile is fresh", not
# as a fact about the dependency in the job title.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - infra
      # The `changelog` context is required on main's ruleset and matches any
      # path under `server/` — which every go.mod bump is. A bot cannot write
      # a changelog entry, and it cannot label its own PR after the fact
      # either, so creation time is the one moment this can be applied. On a
      # bump a rider should actually hear about, drop the label by hand and
      # add the changelog.d/ entry: changelog.yml triggers on `unlabeled` and
      # re-reports, which is the same path #1044 opened for the label itself.
      - no-changelog
    commit-message:
      # `deps` is one of the scopes in .claude/rules/git.md, and this subject
      # becomes main's squash commit verbatim — a single-commit branch takes
      # the commit's subject, not the PR title (#2341).
      prefix: chore(deps)
    groups:
      go:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - infra
      # web/src is the other half of the `changelog` path match. The reasoning
      # above applies unchanged, and rather more often: livekit-client and
      # @lucide/svelte are both rider-visible when they move.
      - no-changelog
    commit-message:
      prefix: chore(deps)
    groups:
      web:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - infra
      # Nothing under desktop/ is on the `changelog` job's path list, so this
      # one is honest rather than a workaround: the shell ships on its own
      # train (ADR-0037) and its dependency bumps are invisible in the
      # server's release notes by construction.
      - no-changelog
    commit-message:
      prefix: chore(deps)
    groups:
      desktop:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - infra
      - no-changelog
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
    groups:
      images:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - infra
    commit-message:
      prefix: chore(ci)
    groups:
      # Majors included here, unlike the three above — and grouping matters
      # more since every action was pinned to a commit SHA (#2353). A tag pin
      # moved only on a major; a commit pin moves on every patch, so ungrouped
      # this would be the noisiest ecosystem in the file rather than the
      # quietest. An action's bump is usually a runner or Node-version change
      # with an unchanged `with:` block, and the diff is forty hex characters
      # either way: the release notes Dependabot quotes in the PR body are the
      # review, not the diff.
      #
      # Dependabot is also what keeps those pins current — it rewrites the SHA
      # *and* the trailing `# vX.Y.Z` comment, which is why ci.yml's `docs` job
      # insists the comment is there.
      actions:
        patterns: ['*']
