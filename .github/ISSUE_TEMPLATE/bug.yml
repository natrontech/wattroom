name: Bug report
description: Something broke
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: 'Chrome 138 / macOS, Kickr Core fw 1.4.8, simulated trainer, …'
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
