<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>WattRoom</title>
		<!--
			The server-down screen (errors.md: a page never renders blank on
			failure, and recovery is one big button). Deliberately a static file
			with no build step and no imports — it has to render when the thing
			that serves everything else is exactly what is unreachable.

			Colours are ADR-0005's Outrun surfaces, hardcoded because this file
			cannot reach the app's stylesheet for the same reason.
		-->
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				height: 100vh;
				display: grid;
				place-content: center;
				gap: 1rem;
				text-align: center;
				background: #0a0118;
				color: #fff;
				font: 15px/1.5 system-ui, -apple-system, sans-serif;
				-webkit-app-region: drag;
			}
			h1 {
				font-size: 1.35rem;
				margin: 0;
			}
			p {
				margin: 0;
				color: #9182b8;
				max-width: 34ch;
				font-size: 0.85rem;
			}
			code {
				color: #9182b8;
				font-size: 0.75rem;
				word-break: break-all;
			}
			button {
				-webkit-app-region: no-drag;
				justify-self: center;
				margin-top: 0.5rem;
				padding: 0.7rem 1.6rem;
				font: inherit;
				font-weight: 600;
				color: #fff;
				background: #8b2bff;
				border: 0;
				border-radius: 8px;
				cursor: pointer;
			}
			button:hover {
				background: #7a1ff0;
			}
		</style>
	</head>
	<body>
		<h1>WattRoom can’t be reached</h1>
		<p id="why">
			The app didn’t answer. If you’re offline this is expected — a room is
			other people, so there is nothing to ride alone here.
		</p>
		<code id="target"></code>
		<button id="retry" autofocus>Try again</button>

		<script>
			const params = new URLSearchParams(location.search);
			const url = params.get('url');
			const reason = params.get('reason');
			if (url) document.getElementById('target').textContent = url;
			if (reason) {
				document.getElementById('why').textContent =
					'The app didn’t answer (' +
					reason +
					'). If you’re offline this is expected — a room is other people, so there is nothing to ride alone here.';
			}
			document.getElementById('retry').addEventListener('click', () => {
				window.wattroom?.retry();
			});
		</script>
	</body>
</html>
