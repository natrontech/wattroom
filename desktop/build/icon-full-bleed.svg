<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>WattRoom</title>
  <!--
    The installed web app's icon (ADR-0090): icon.svg's tile and bars, the
    tile run to the edges. A home screen cuts its own shape — iOS a squircle,
    Android whatever the launcher likes — and fills anything transparent with
    black, so the margin icon.svg keeps for the desktop would show there as a
    black frame. The bars sit inside the centre circle of 80% a maskable icon
    keeps (their 510 × 391 box has a 643 px diagonal, under 819).

    Colours are literal, as in icon.svg. Regenerate the PNGs the manifest and
    app.html name (the manifest's "any" icons are icon.svg's, see there):
      rsvg-convert -w 180 -h 180 icon-full-bleed.svg > ../../web/static/icons/apple-touch-icon.png
      rsvg-convert -w 192 -h 192 icon-full-bleed.svg > ../../web/static/icons/maskable-192.png
      rsvg-convert -w 512 -h 512 icon-full-bleed.svg > ../../web/static/icons/maskable-512.png
  -->
  <defs>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3d8b"/>
      <stop offset="100%" stop-color="#8b2bff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0736"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </linearGradient>
    <!-- ADR-0005: only live data glows, and the bars are the watts. -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <g transform="translate(240 214) scale(8.5)" fill="url(#bars)" filter="url(#glow)">
    <rect x="2" y="12" width="8" height="46" rx="4"/>
    <rect x="15" y="38" width="8" height="20" rx="4"/>
    <rect x="28" y="24" width="8" height="34" rx="4"/>
    <rect x="41" y="38" width="8" height="20" rx="4"/>
    <rect x="54" y="12" width="8" height="46" rx="4"/>
  </g>
</svg>
