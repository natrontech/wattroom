<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>WattRoom</title>
  <!--
    The app icon (#296). The favicon's five bars, drawn for 16–32px, set on the
    surface colour at Apple's icon geometry: an 824px rounded square on a
    1024px canvas, corner radius 22.37% of the side. Windows and Linux take the
    same file; the transparent margin reads as ordinary padding there.

    Colours are literal: the theme's dark values of its surface,
    watt and neon tokens. An icon renders outside the page, so CSS
    variables never resolve here.

    Regenerate the PNG electron-builder actually reads:
      rsvg-convert -w 1024 -h 1024 icon.svg > icon.png
  -->
  <defs>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3d8b"/>
      <stop offset="100%" stop-color="#8b2bff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0736"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </linearGradient>
    <!-- ADR-0005: only live data glows, and the bars are the watts. -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
  <!-- The favicon's 64-unit grid, scaled 8.5× and centred on the tile. -->
  <g transform="translate(240 214) scale(8.5)" fill="url(#bars)" filter="url(#glow)">
    <rect x="2" y="12" width="8" height="46" rx="4"/>
    <rect x="15" y="38" width="8" height="20" rx="4"/>
    <rect x="28" y="24" width="8" height="34" rx="4"/>
    <rect x="41" y="38" width="8" height="20" rx="4"/>
    <rect x="54" y="12" width="8" height="46" rx="4"/>
  </g>
</svg>
