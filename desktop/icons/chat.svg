<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Chat</title>
  <!--
    The picture on a chat channel's or a DM's OS notification (#2696): the
    lucide message-circle the app draws for them, white on the neon tile so
    it reads in a light and a dark notification centre alike. chat.png here
    and web/static/notify/chat.png are this, rendered:
    rsvg-convert -w 256 -h 256 desktop/icons/chat.svg
  -->
  <rect width="256" height="256" rx="56" fill="#8b2bff"/>
  <g transform="translate(56 56) scale(6)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>
  </g>
</svg>
