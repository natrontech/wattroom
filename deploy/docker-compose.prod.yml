# Production: one VM, one compose stack (ADR-0002). Copy deploy/.env.example
# to .env beside this file, fill it, then: docker compose up -d
services:
  wattroom:
    image: ghcr.io/natrontech/wattroom:${WATTROOM_TAG:?set WATTROOM_TAG in .env — the release this VM is pinned to}
    # Above the server's drainGrace (main.go): a stop waits for the ride
    # saver's whole retry policy before the kill lands (audit 2026-09-09).
    stop_grace_period: 180s
    restart: unless-stopped
    env_file: .env
    environment:
      WATTROOM_DB: postgres://wattroom:${POSTGRES_PASSWORD}@postgres:5432/wattroom
      WATTROOM_BASE_URL: https://${DOMAIN}
      WATTROOM_LIVEKIT_URL: wss://${DOMAIN}/livekit
      WATTROOM_FEEDBACK_DIR: /data/feedback
      # The music pool's audio (ADR-0015): metadata is in Postgres, the files
      # are here. Its own volume, because the pg_dump before a rollout does
      # not carry it and a 2 GB-per-rider library has no business in one.
      WATTROOM_TRACKS_DIR: /data/tracks
      # Caddy is in front (see Caddyfile) and appends the peer it saw to
      # X-Forwarded-For, so the last hop is the caller's real address and the
      # per-address ceilings key on it. Unset — a binary facing the internet
      # directly — the header is whatever the caller typed, and the server
      # keys on the socket instead (#2258). Set this ONLY with a proxy in
      # front that appends.
      WATTROOM_TRUSTED_PROXY: '1'
    volumes:
      - feedback:/data/feedback
      - tracks:/data/tracks
    depends_on:
      - postgres
    expose:
      - '8080'
      # The metrics listener (#1738). Its own port, reachable over the
      # monitoring network and proxied by nothing — so what it publishes does
      # not depend on an edge remembering to block a path.
      - '9091'
    # default keeps postgres/caddy reachable; monitoring is how the homelab
    # Prometheus gets at /metrics without Caddy publishing it (ADR-0019,
    # amended by #1738: scrape wattroom:9091, not wattroom:8080).
    networks:
      - default
      - monitoring
    # Loopback only: Caddy fronts the public side, and this is how the updater
    # on this host asks /api/version and /api/healthz — and /metrics on 9091,
    # for the ride check that refuses to restart into a session. Not an
    # exposure — 127.0.0.1 is not reachable off the VM.
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:9091:9091'

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: wattroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wattroom
    volumes:
      - pgdata:/var/lib/postgresql
    expose:
      - '5432'

  # LiveKit on host network: WebRTC needs real UDP on the node IP
  # (ADR-0002 accepted this; the API keys are real, not --dev).
  livekit:
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    # LiveKit runs on the host network, which no bridge container reaches as
    # `localhost` — the Caddyfile proxies it at this name instead (#2827).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./maintenance.html:/srv/maintenance.html:ro
      - caddy-data:/data
      - caddy-config:/config

  # pg_dump every night at 03:17, kept 14 days; sync the dump dir off-VM with
  # whatever the homelab already uses (restic/rclone) — the cron only produces.
  backup:
    image: postgres:18
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          sleep $$(( ($$(date -d '03:17 tomorrow' +%s 2>/dev/null || date +%s) - $$(date +%s)) % 86400 + 1 ))
          pg_dump postgres://wattroom:$${POSTGRES_PASSWORD}@postgres:5432/wattroom \
            | gzip > /backups/wattroom-$$(date +%F).sql.gz
          find /backups -name 'wattroom-*.sql.gz' -mtime +14 -delete
        done
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres

volumes:
  pgdata:
  feedback:
  tracks:
  caddy-data:
  caddy-config:

# One Prometheus for the homelab, not one per workload (ADR-0006's convention,
# ADR-0019 applying it). Create it once with `docker network create monitoring`
# if the homelab stack hasn't already; rename both sides if yours differs.
networks:
  monitoring:
    external: true
