# Prometheus alert rules for WattRoom, kept with the app whose failure modes
# they describe. Like the rest of deploy/, this is the self-hosting reference:
# README.md's Monitoring section mounts it into your Prometheus.
#
# wattroom.ch does not load this file. Its Prometheus runs on another VM and
# reads only the rules in janlauber/homelab, which holds a hand-ported copy.
# That copy drifts: the three job-staleness rules below were never ported
# (#2679). A rule changed here has to be ported there as well.
#
# Every rule below watches a metric that something actually produces. The two
# synthetic-ride rules that used to sit here watched wattroom_synthetic_ride_*,
# which nothing pushes yet — absent() would have paged on load. They move with
# the synthetic timer that produces them.
#
# The rules alert on the subsystems that go quiet first, not on HTTP 200: a
# healthy homepage over a broken ride is exactly the failure mode the homelab
# observability rule was written about.
#
# They need a job scraping `wattroom:9091` — the metrics listener, not the app
# port, which has answered 404 for /metrics since #1738. A job still pointed at
# 8080 makes every rule here unfirable and only WattroomDown says so (#2321).
# README.md's Monitoring section has the scrape config to copy.
#
# That scrape leaves honor_labels off, as Prometheus does by default, so the
# target's job="wattroom" wins and the app's own `job` label on the
# background-job metrics arrives as `exported_job`. The job rules select on
# exported_job; WattroomDown selects on job. alerts.test.yml feeds them series
# labelled the way a real scrape labels them, and CI runs it with promtool.
groups:
  - name: wattroom-ride
    rules:
      # Ride vitals, scraped from /metrics over the monitoring network.
      - alert: WattroomTicksSilentWithRiders
        expr: wattroom_room_riders > 0 and rate(wattroom_room_ticks_total[5m]) == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: 'Riders are connected but no room ticks are flowing'

      # A supervised loop the supervisor abandoned (audit 2026-09-09): a
      # room's clock, a queue worker or a sweep is gone for good, and the
      # only other trace is a log line nobody reads.
      - alert: WattroomGoroutineGaveUp
        expr: increase(wattroom_goroutine_gaveup_total[15m]) > 0
        labels: { severity: page }
        annotations:
          summary: 'A supervised loop gave up after repeated panics — check the server log for "gave up"'

      # A minute-cadence job that has not succeeded in fifteen: reminders,
      # Strava deliveries, the voice clock, the LiveKit reconciler.
      - alert: WattroomMinuteJobStale
        expr: >-
          time() - wattroom_job_last_success_timestamp_seconds{exported_job=~"session reminders|strava delivery sweep|voice clock|livekit reconciler"} > 900
        for: 5m
        labels: { severity: page }
        annotations:
          summary: 'Background job {{ $labels.exported_job }} has not succeeded in 15 minutes'

      # The daily sweeps: three days without a success is a stopped ticker,
      # not a quiet day.
      - alert: WattroomDailyJobStale
        expr: >-
          time() - wattroom_job_last_success_timestamp_seconds{exported_job=~"housekeeping .*"} > 259200
        labels: { severity: warn }
        annotations:
          summary: 'Daily sweep {{ $labels.exported_job }} has not succeeded in three days'

      # absent() guard: a scrape that stopped must not read as a healthy
      # service. This one is safe to ship now — the target exists.
      - alert: WattroomDown
        expr: up{job="wattroom"} == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: 'Prometheus cannot scrape wattroom — the binary or the VM is gone'
