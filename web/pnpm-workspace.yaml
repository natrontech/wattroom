allowBuilds:
  protobufjs: false

onlyBuiltDependencies:
  - esbuild

# Security floors, not preferences: cookie < 0.7.0 is CVE-2024-47764 and
# reached us through @sveltejs/kit 2. The selector lifts only a vulnerable
# cookie: a plain `cookie: ^0.7.2` held kit 3 back from the cookie 2 it needs,
# and prerendering died on `parseCookie is not a function`. They live here rather than in
# package.json's `pnpm` field because pnpm 12 no longer reads that field —
# an override left there is dropped silently, with a green build (#2394).
overrides:
  postcss: '>=8.5.23'
  'cookie@<0.7.0': ^0.7.2
