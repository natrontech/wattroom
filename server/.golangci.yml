version: "2"

# standard = errcheck, govet, staticcheck, unused, ineffassign + friends.
# Additions: security (gosec), error-wrapping correctness (errorlint),
# leaked ctx/body (noctx, bodyclose), spelling, pointless conversions.
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - noctx
    - bodyclose
    - misspell
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true

# gofmt as a check (#2785): the format-on-edit hook covers edits made through
# the agent tooling, and a file written any other way landed unformatted with
# CI green.
formatters:
  enable:
    - gofmt
